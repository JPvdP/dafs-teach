  - id: practice_aggregation
    title: "Practice: Aggregating Data"
    instructions: |
      More practice with summary statistics — this time using `.mean()`, `.max()`, and `.min()` instead of `.sum()`.

      | Method       | Result            |
      |--------------|-------------------|
      | `.mean()`    | Average           |
      | `.max()`     | Largest value     |
      | `.min()`     | Smallest value    |

