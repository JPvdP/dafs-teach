      Using the trips DataFrame below (distances in km):
      1. Create `avg_distance` — the mean of `distance_km`. Print it rounded to 1 decimal place.
      2. Create `max_distance` — the longest trip. Print it.
      3. Create `min_distance` — the shortest trip. Print it.
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          "trip_id":     [1, 2, 3, 4, 5],
          "distance_km": [12.5, 34.2, 8.1, 50.0, 22.3],
      })

      # Average distance
      avg_distance =
      print(round(avg_distance, 1))

      # Longest trip
      max_distance =
      print(max_distance)

      # Shortest trip
      min_distance =
      print(min_distance)
    tests:
      - type: output_equals
        value: "25.4\n50.0\n8.1"
      - type: assert
        code: |
          assert abs(avg_distance - 25.42) < 0.01, f'avg_distance should be ~25.42, got {avg_distance}'
          assert max_distance == 50.0, f'max_distance should be 50.0, got {max_distance}'
          assert min_distance == 8.1, f'min_distance should be 8.1, got {min_distance}'
        description: "avg_distance ~25.42, max_distance=50.0, min_distance=8.1"
    hints:
      - "avg_distance = df['distance_km'].mean()"
      - "max_distance = df['distance_km'].max()"
      - "min_distance = df['distance_km'].min()"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "trip_id":     [1, 2, 3, 4, 5],
          "distance_km": [12.5, 34.2, 8.1, 50.0, 22.3],
      })

      avg_distance = df["distance_km"].mean()
      print(round(avg_distance, 1))

      max_distance = df["distance_km"].max()
      print(max_distance)

      min_distance = df["distance_km"].min()
      print(min_distance)
