  - id: select_filter
    title: "Selecting and Filtering"
    instructions: |
      pandas makes it easy to select columns and filter rows.

      **Selecting a column:**
      ```python
      df["price"]          # returns a Series
      df[["name", "price"]] # returns a DataFrame with two columns
      ```

      **Filtering rows** (boolean indexing):
      ```python
      df[df["price"] > 100]   # rows where price > 100
      ```

      **Your task:**
      Using the products DataFrame from the previous exercise:
      1. Create `expensive` — a filtered DataFrame containing only products with `price > 100`
      2. Print the `product` column of `expensive`
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      # Filter rows where price > 100
      expensive =

      # Print only the product column of expensive
      print(expensive["product"])
    tests:
      - type: output_contains
        value: "Laptop"
      - type: output_contains
        value: "Monitor"
      - type: assert
        code: |
          assert len(expensive) == 2, 'expensive should have 2 rows (Laptop and Monitor)'
          assert "Mouse" not in expensive["product"].values, 'Mouse should not be in expensive'
        description: "`expensive` should contain only Laptop and Monitor"
    hints:
      - "Boolean filter: expensive = df[df[\"price\"] > 100]"
      - "Then print(expensive[\"product\"]) for just that column"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      expensive = df[df["price"] > 100]
      print(expensive["product"])

  - id: aggregation
    title: "Aggregating Data"
    instructions: |
      pandas has built-in methods for summary statistics:

      | Method       | Result            |
      |--------------|-------------------|
      | `.sum()`     | Total             |
      | `.mean()`    | Average           |
      | `.max()`     | Largest value     |
      | `.min()`     | Smallest value    |
      | `.describe()`| Full summary      |

      **Your task:**
      Using the products DataFrame:
      1. Calculate and print the **total revenue** (price × sold) for all products combined.
         Store the result in a variable called `total_revenue`.
      2. Print it rounded to 2 decimal places.

      Expected answer: **36197.35**
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      # Calculate revenue per product, then sum it up
      total_revenue =

      print(round(total_revenue, 2))
    tests:
      - type: output_equals
        value: "36197.35"
      - type: assert
        code: "assert abs(total_revenue - 36197.35) < 0.01, f'total_revenue should be ~36197.35, got {total_revenue}'"
        description: "`total_revenue` should be approximately 36197.35"
    hints:
      - "First compute a 'revenue' column: df['revenue'] = df['price'] * df['sold']"
      - "Then sum it: total_revenue = df['revenue'].sum()"
      - "Or in one line: total_revenue = (df['price'] * df['sold']).sum()"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      total_revenue = (df["price"] * df["sold"]).sum()
      print(round(total_revenue, 2))

  - id: practice_create_df
    title: "Practice: Creating a DataFrame"
    instructions: |
      Time to practice creating a DataFrame from scratch, using a new example.

      **Your task:**
      Create a DataFrame called `books` with these columns and values:

      | title       | author         | pages |
      |-------------|----------------|-------|
      | Dune        | Frank Herbert  | 412   |
      | The Hobbit  | J.R.R. Tolkien | 310   |
      | 1984        | George Orwell  | 328   |

      Then print the DataFrame.
    starter_code: |
      import pandas as pd

      books = pd.DataFrame({
          # fill in the columns here
      })

      print(books)
    tests:
      - type: output_contains
        value: "Dune"
      - type: output_contains
        value: "Tolkien"
      - type: assert
        code: |
          assert list(books.columns) == ['title', 'author', 'pages'], 'columns should be title, author, pages'
          assert len(books) == 3, 'books should have 3 rows'
          assert books['pages'].tolist() == [412, 310, 328], 'pages values are wrong'
        description: "books should have columns title/author/pages and 3 rows"
    hints:
      - "Each key in the dict becomes a column, each list becomes the column values"
      - "Make sure column names match exactly: 'title', 'author', 'pages'"
    solution: |
      import pandas as pd

      books = pd.DataFrame({
          "title": ["Dune", "The Hobbit", "1984"],
          "author": ["Frank Herbert", "J.R.R. Tolkien", "George Orwell"],
          "pages": [412, 310, 328],
      })

      print(books)

  - id: practice_explore
    title: "Practice: Exploring a DataFrame"
    instructions: |
      Let's practice exploring a DataFrame, and add one more method to your toolkit: `df.tail(n)` — just like `df.head(n)`, but it shows the **last** n rows instead of the first.

      | Method / attribute | What it shows |
      |--------------------|---------------|
      | `df.shape`         | (rows, columns) |
      | `df.dtypes`        | Data type per column |
      | `df.tail(n)`       | Last n rows |

      **Your task:**
      The DataFrame `df` below contains weather data for several cities.
