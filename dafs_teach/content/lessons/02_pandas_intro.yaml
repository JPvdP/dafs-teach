          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      # Filter rows where price > 100
      expensive =

      # Print only the product column of expensive
      print()
    tests:
      - type: output_contains
        value: "Laptop"
      - type: output_contains
        value: "Monitor"
      - type: output_contains
        value: "Name: product"
      - type: assert
        code: |
          assert len(expensive) == 2, 'expensive should have 2 rows (Laptop and Monitor)'
          assert "Mouse" not in expensive["product"].values, 'Mouse should not be in expensive'
        description: "`expensive` should contain only Laptop and Monitor"
    hints:
      - "Start with the comparison: df[\"price\"] > 100 gives True/False for every row"
      - "Put that comparison inside df[ ]: expensive = df[df[\"price\"] > 100]"
      - "Select one column by putting its name in square brackets after the DataFrame: expensive[\"product\"]"
      - "print(expensive[\"product\"])"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      expensive = df[df["price"] > 100]
      print(expensive["product"])

  - id: aggregation
    title: "Aggregating Data"
    instructions: |
      Now that you can select a column, you can summarise it — for example, calculate its total or its average.

      **Doing math with whole columns**

      You can use the normal math operators on columns. pandas then calculates **row by row**:

      ```python
      df["price"] * 2             # every price doubled
      df["price"] * df["sold"]    # row 0's price × row 0's sold, row 1's price × row 1's sold, ...
      ```

      The result is a new Series, with one value per row.

      **Summarising a column with methods**

      ```python
      df["sold"].max()    # 120 — the largest number of items sold
      ```

      `.max()` is a **method**. pandas has methods for all the common summary statistics:

      | Method        | Result            |
      |---------------|-------------------|
      | `.sum()`      | Total             |
      | `.mean()`     | Average           |
      | `.max()`      | Largest value     |
      | `.min()`      | Smallest value    |
      | `.describe()` | Full summary      |

      **What is a method, and how is it different from a function?**

      You've now seen three ways of telling Python to do something:

      | | How you write it | Examples | What it does |
      |---|---|---|---|
      | **Operator** | A symbol *between* two values | `price * sold`, `a + b` | Combines the values on its left and right |
      | **Function** | `name(value)` | `print(x)`, `len(x)`, `sum(x)`, `round(x, 2)` | A standalone tool: you give it a value *inside* the parentheses |
      | **Method** | `value.name()` | `df.head(3)`, `df["sold"].sum()` | A tool that *belongs to* a value: you write it *after* the value, with a dot |

      A method is a function that belongs to a particular kind of value. Compare:

      ```python
      sum(daily_energy_kwh)   # function: you hand the list to sum()
      df["sold"].sum()        # method: the Series calculates its own sum
      ```

      Both calculate a total, but they're written differently. With a function, the value goes *inside* the parentheses. With a method, the value comes *before* the dot, and the parentheses are often empty.

      Which methods exist depends on the type of value. A Series has `.sum()`, `.mean()` and `.max()`, because pandas built those in. A list from the previous lesson doesn't have a `.mean()` method: `[1, 2, 3].mean()` gives an error.

      Don't forget the parentheses: `df["sold"].sum` (without `()`) doesn't calculate anything — it just refers to the method without running it.

      **Your task:**
      Using the products DataFrame:
      1. Calculate the **total revenue** (price × sold) for all products combined, and store the result in a variable called `total_revenue`.
      2. Print it rounded to 2 decimal places.
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      # Calculate revenue per product, then sum it up
      total_revenue =

      print(round(total_revenue, 2))
    tests:
      - type: assert
        code: "assert abs(total_revenue - 36197.35) < 0.01, 'total_revenue is not correct yet. Did you multiply price by sold for each product, and then add everything up?'"
        description: "`total_revenue` should be the combined revenue of all products"
    hints:
      - "Revenue per product is price × sold: df['price'] * df['sold'] gives one value per product"
      - "You can store that as a new column: df['revenue'] = df['price'] * df['sold']"
      - "Then sum it: total_revenue = df['revenue'].sum()"
      - "Or in one line: total_revenue = (df['price'] * df['sold']).sum()"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      total_revenue = (df["price"] * df["sold"]).sum()
      print(round(total_revenue, 2))

  - id: practice_create_df
    title: "Practice: Creating a DataFrame"
    instructions: |
