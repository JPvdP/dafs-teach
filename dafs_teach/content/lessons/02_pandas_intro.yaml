      df = pd.DataFrame({
          "city":        ["Oslo", "Amsterdam", "Berlin", "Madrid", "Rome", "Athens"],
          "temperature": [5, 10, 8, 15, 12, 18],
          "humidity":    [80, 75, 70, 60, 65, 55],
      })

      # 1. Print the shape


      # 2. Print the data types


      # 3. Print the last 2 rows

    tests:
      - type: output_contains
        value: "(6, 3)"
      - type: output_contains
        value: "temperature"
      - type: output_contains
        value: "Rome"
      - type: output_contains
        value: "Athens"
    hints:
      - "print(df.shape) prints the shape tuple"
      - "print(df.dtypes) prints the data type of every column"
      - "print(df.tail(2)) prints the last 2 rows"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "city":        ["Oslo", "Amsterdam", "Berlin", "Madrid", "Rome", "Athens"],
          "temperature": [5, 10, 8, 15, 12, 18],
          "humidity":    [80, 75, 70, 60, 65, 55],
      })

      print(df.shape)
      print(df.dtypes)
