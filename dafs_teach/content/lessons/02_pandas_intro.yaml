title: Introduction to Pandas
description: Learn to load, explore, and manipulate tabular data with pandas — the core library for data analysis in Python.

exercises:

  - id: create_df
    title: "Creating a DataFrame"
    instructions: |
      **pandas** is the go-to package for working with tabular data.
      A `DataFrame` is like a spreadsheet — rows and columns. Unlike a NumPy matrix, each column can hold a different kind of data: one column of text, one of numbers, one of `True`/`False`.

      As you saw in the previous lesson, you first **import** pandas, with its usual nickname `pd`:

      ```python
      import pandas as pd
      ```

      **Using a tool from a package: the dot `.`**

      This works exactly like `np.array()` in the previous lesson. To use a function from pandas, you write the package's short name, a **dot**, and then the name of the function:

      ```python
      pd.DataFrame( ... )
      ```

      Read the dot as **"from"**: `pd.DataFrame` means *"the `DataFrame` function **from** pandas"*. The `pd.` part tells Python which toolbox to look in. If you leave it out and write just `DataFrame( ... )`, Python doesn't know where to find it and you get `NameError: name 'DataFrame' is not defined`.

      **Building a DataFrame from a dictionary**

      Remember the dictionary of lists from the previous lesson? `pd.DataFrame()` turns exactly that into a table: each **key** becomes a column name, and each **list** becomes the values in that column.

      ```python
      import pandas as pd

      df = pd.DataFrame({
          "column_a": [1, 2, 3],
          "column_b": ["x", "y", "z"],
      })

      print(df)
      ```

      Output:

      ```
         column_a column_b
      0         1        x
      1         2        y
      2         3        z
      ```

      The numbers `0`, `1`, `2` on the left are row labels (the **index**) that pandas adds automatically.

      A few details to watch:
      - Notice the round brackets `( )` *and* the curly brackets `{ }`: the dictionary `{ ... }` goes **inside** the function call `pd.DataFrame( ... )`.
      - All lists must have the same length — every column needs a value for every row.
      - The comma after the last column (`"column_b": ["x", "y", "z"],`) is **optional**. Python allows a comma after the last item in a dictionary or list, and both versions work. Many programmers keep it, so that adding another column later is just adding one more line.

      **Your task:**
      Create a DataFrame called `df` with these columns and values:

      | name    | age | city      |
      |---------|-----|-----------|
      | Alice   | 28  | Utrecht   |
      | Bob     | 34  | Amsterdam |
      | Charlie | 22  | Rotterdam |

      Then print the DataFrame.
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          # fill in the columns here
      })

      print(df)
    tests:
      - type: output_contains
        value: "Alice"
      - type: output_contains
        value: "Amsterdam"
      - type: assert
        code: |
          assert list(df.columns) == ['name', 'age', 'city'], 'columns should be name, age, city'
          assert len(df) == 3, 'DataFrame should have 3 rows'
          assert df['age'].tolist() == [28, 34, 22], 'age values are wrong'
        description: "DataFrame should have columns name/age/city and 3 rows"
    hints:
      - "Each key in the dict becomes a column, each list becomes the column values"
      - "Make sure column names match exactly: 'name', 'age', 'city'"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "name": ["Alice", "Bob", "Charlie"],
          "age": [28, 34, 22],
          "city": ["Utrecht", "Amsterdam", "Rotterdam"],
      })

      print(df)

  - id: explore
    title: "Exploring a DataFrame"
    instructions: |
      Before analysing data, you need to understand its shape and contents. For that you'll use the dot again — but in a new way.

      **The dot, part 2: asking a DataFrame about itself**

      In the previous exercise, the dot came after the **package** name: `pd.DataFrame` — "the `DataFrame` tool from pandas".

      Now the dot comes after **your own variable**: `df.shape`. The dot still means "from" / "belonging to", but what's on the left of it has changed:

      | Code | What's left of the dot | Read it as |
      |------|------------------------|------------|
      | `pd.DataFrame(...)` | `pd` — the pandas package | "use the `DataFrame` tool from pandas" |
      | `df.shape` | `df` — your DataFrame | "the shape of `df`" |
      | `df.head(3)` | `df` — your DataFrame | "show the first 3 rows of `df`" |

      Why can you write things after `df.`? Because when `pd.DataFrame()` creates a DataFrame, pandas gives it a set of built-in information and tools. **Every** DataFrame gets them automatically, so `df.head()` works on any DataFrame you create. A plain number such as `score = 10` doesn't have them — `score.head()` would give an error.

      **Rule of thumb:**
      - `pd.something` → you use a tool from the pandas package (for example, to *create* a DataFrame)
      - `df.something` → you ask *your* DataFrame for information, or tell it to do something

      **With or without parentheses?**

      There are two kinds of things that can come after `df.`:
      - **Attributes** are *information* stored about the DataFrame. You write them **without** parentheses: `df.shape`, `df.columns`, `df.dtypes`.
      - **Methods** are *actions* the DataFrame can perform. You write them **with** parentheses, sometimes with a value inside: `df.head(3)`. We'll look at methods in more detail in the "Aggregating Data" exercise.

      Mixing them up gives an error: `df.shape()` gives `TypeError: 'tuple' object is not callable`, because `shape` is information, not an action.

      | Code | Kind | What it shows |
      |------|------|---------------|
      | `df.shape`   | attribute | (number of rows, number of columns) |
      | `df.columns` | attribute | Column names |
      | `df.dtypes`  | attribute | Data type of each column |
      | `df.head(n)` | method | First n rows |

      **Your task:**
      The DataFrame `df` below contains sales data.
      1. Print the **shape** of the DataFrame
      2. Print the **column names**
      3. Print the **first 3 rows**
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      # 1. Print the shape


      # 2. Print the column names


      # 3. Print the first 3 rows


    tests:
      - type: output_contains
        value: "(5, 3)"
      - type: output_contains
        value: "product"
      - type: output_contains
        value: "Laptop"
      - type: output_contains
        value: "Mouse"
      - type: output_contains
        value: "Keyboard"
    hints:
      - "print(df.shape) prints the shape tuple"
      - "print(df.columns) prints an Index of column names"
      - "print(df.head(3)) prints the first 3 rows"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      print(df.shape)
      print(df.columns)
      print(df.head(3))

  - id: select_filter
    title: "Selecting and Filtering"
    instructions: |
      pandas makes it easy to select columns and filter rows. All examples below use the products DataFrame from the previous exercise.

      **Selecting one column — a Series**

      ```python
      df["product"]
      ```

      You put the column name in square brackets after `df` — just like looking up a key in a dictionary. The result is that single column, which pandas calls a **Series**.

      A **Series** is one column of data: a list of values, together with the row labels (the index). Printing `df["product"]` shows:

      ```
      0      Laptop
      1       Mouse
      2    Keyboard
      3     Monitor
      4      Webcam
      Name: product, dtype: object
      ```

      - On the **left**: the row labels (`0` to `4`), the same as in the DataFrame
      - On the **right**: the values in the column
      - On the **last line**: the column's name, and its data type (`object` is how pandas usually shows text)

      You can think of a DataFrame as several Series side by side, sharing the same row labels. A Series has its own methods too — you'll use `.sum()` and `.mean()` on Series in the next exercise.

      **Selecting several columns — double brackets `[[ ]]`**

      ```python
      df[["product", "price"]]
      ```

      The two pairs of brackets each have a different job:
      - The **inner** brackets `["product", "price"]` are a **list** (like in the previous lesson), containing the names of the columns you want
      - The **outer** brackets `df[ ... ]` mean "select from `df`"

      So read it as: *"select from `df` the columns in this list"*. Because you're selecting more than one column, the result is a **DataFrame**, not a Series:

      ```
          product   price
      0    Laptop  999.99
      1     Mouse   29.99
      2  Keyboard   79.99
      3   Monitor  349.99
      4    Webcam   89.99
      ```

      With single brackets, `df["product", "price"]` gives a `KeyError` — pandas then looks for *one* column with the strange name `("product", "price")`, and can't find it.

      **Filtering rows**

      ```python
      df[df["price"] > 100]   # only the rows where price > 100
      ```

      Read this from the inside out:
      1. `df["price"] > 100` compares **every** price with 100. The result is a Series of `True`/`False` values, one per row:
         ```
         0     True
         1    False
         2    False
         3     True
         4    False
         Name: price, dtype: bool
         ```
      2. `df[ ... ]` around it keeps only the rows where the value is `True` — here rows 0 (Laptop) and 3 (Monitor).

      **Your task:**
      Using the products DataFrame:
      1. Create `expensive` — a filtered DataFrame containing only products with `price > 100`
      2. Print only the `product` column of `expensive` (this will be a Series)
    starter_code: |
