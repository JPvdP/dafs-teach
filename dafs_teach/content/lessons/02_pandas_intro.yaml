      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      # Filter rows where price > 100
      expensive =

      # Print only the product column of expensive
      print(expensive["product"])
    tests:
      - type: output_contains
        value: "Laptop"
      - type: output_contains
        value: "Monitor"
      - type: assert
        code: |
          assert len(expensive) == 2, 'expensive should have 2 rows (Laptop and Monitor)'
          assert "Mouse" not in expensive["product"].values, 'Mouse should not be in expensive'
        description: "`expensive` should contain only Laptop and Monitor"
    hints:
      - "Boolean filter: expensive = df[df[\"price\"] > 100]"
      - "Then print(expensive[\"product\"]) for just that column"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      expensive = df[df["price"] > 100]
      print(expensive["product"])

  - id: aggregation
    title: "Aggregating Data"
    instructions: |
      pandas has built-in methods for summary statistics:

      | Method       | Result            |
      |--------------|-------------------|
      | `.sum()`     | Total             |
      | `.mean()`    | Average           |
      | `.max()`     | Largest value     |
      | `.min()`     | Smallest value    |
      | `.describe()`| Full summary      |

      **Your task:**
      Using the products DataFrame:
      1. Calculate and print the **total revenue** (price × sold) for all products combined.
         Store the result in a variable called `total_revenue`.
      2. Print it rounded to 2 decimal places.

      Expected answer: **32224.4**
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      # Calculate revenue per product, then sum it up
      total_revenue =

      print(round(total_revenue, 2))
    tests:
      - type: output_equals
        value: "32224.4"
      - type: assert
        code: "assert abs(total_revenue - 32224.4) < 0.01, f'total_revenue should be ~32224.4, got {total_revenue}'"
        description: "`total_revenue` should be approximately 32224.4"
    hints:
      - "First compute a 'revenue' column: df['revenue'] = df['price'] * df['sold']"
      - "Then sum it: total_revenue = df['revenue'].sum()"
      - "Or in one line: total_revenue = (df['price'] * df['sold']).sum()"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "product": ["Laptop", "Mouse", "Keyboard", "Monitor", "Webcam"],
          "price":   [999.99, 29.99, 79.99, 349.99, 89.99],
          "sold":    [15, 120, 60, 25, 45],
      })

      total_revenue = (df["price"] * df["sold"]).sum()
      print(round(total_revenue, 2))
