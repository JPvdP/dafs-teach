      print(len(energy_sources))
      print(energy_sources[-1])

  - id: create_dict
    title: Creating Dictionaries
    instructions: |
      While lists let you access elements by their **position** (index), dictionaries let you access elements by a **meaningful label** (key). This is like a labelled box system: you give each box a special name and store a value in it.

      ```python
      technology_efficiency = {"Solar": 24, "Wind": 19, "Water": 22}
      print(technology_efficiency["Solar"])  # prints 24
      ```

      A dictionary is a collection of **key-value pairs**, written with curly braces `{}`. You access a value using its key — not a number.

      Use a dictionary when you want to look up items quickly by a **meaningful label**, not by a number. Dictionaries support very fast lookup by key, while with a list, searching by value can take much longer for large datasets.

      To create a dictionary with initial data:

      ```python
      info = {
          "name": "Alice",
          "age": 30,
          "job": "Data Scientist"
      }
      ```

      **Your task:**
      1. Create a dictionary `technology_efficiency` with these key-value pairs:
         - `"Solar"` → `24`
         - `"Wind"` → `19`
         - `"Water"` → `22`
      2. Print the efficiency of `"Solar"`
      3. Print the efficiency of `"Wind"`
    starter_code: |
      technology_efficiency = {
          # add your key-value pairs here
      }

      # Print the efficiency of Solar


      # Print the efficiency of Wind


    tests:
      - type: output_equals
        value: "24\n19"
      - type: assert
        code: |
          assert technology_efficiency["Solar"] == 24
          assert technology_efficiency["Wind"] == 19
          assert technology_efficiency["Water"] == 22
        description: "Dictionary should have Solar=24, Wind=19, Water=22"
    hints:
      - "\"Solar\": 24, — note the colon between key and value"
      - "print(technology_efficiency[\"Solar\"])"
    solution: |
      technology_efficiency = {
          "Solar": 24,
          "Wind": 19,
          "Water": 22,
      }

      print(technology_efficiency["Solar"])
      print(technology_efficiency["Wind"])

  - id: dict_operations
    title: Working with Dictionaries
    instructions: |
      Dictionaries are mutable — you can add, update, or remove entries after creation:

      ```python
      info = {"name": "Alice", "age": 30}

      # Add a new key
      info["city"] = "Utrecht"

      # Update an existing key
      info["age"] = 31

      # Check if a key exists
      print("name" in info)   # True
      ```

      You can also loop over a dictionary:

      ```python
      for key, value in info.items():
          print(f"{key}: {value}")
      ```

      **Your task:**
      1. Create a dictionary `researcher` with:
         - `"name"` → `"Alice"`
         - `"age"` → `30`
         - `"institution"` → `"Utrecht University"`
      2. Add a new key `"field"` with the value `"Sustainability"`
      3. Print the value of `"field"`
      4. Print the total number of keys using `len()`
    starter_code: |
      researcher = {
          "name": "Alice",
          "age": 30,
          "institution": "Utrecht University",
      }

      # Add the "field" key


      # Print the value of "field"


      # Print the number of keys


    tests:
      - type: output_contains
        value: "Sustainability"
      - type: output_contains
        value: "4"
      - type: assert
        code: |
          assert researcher["field"] == "Sustainability"
          assert len(researcher) == 4
        description: "researcher should have 4 keys including 'field'"
    hints:
      - "researcher[\"field\"] = \"Sustainability\""
      - "print(researcher[\"field\"])"
      - "print(len(researcher))"
    solution: |
      researcher = {
          "name": "Alice",
          "age": 30,
          "institution": "Utrecht University",
      }

      researcher["field"] = "Sustainability"

      print(researcher["field"])
