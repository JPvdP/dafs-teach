      - type: output_contains
        value: "3"
      - type: output_contains
        value: "Hydro"
      - type: assert
        code: |
          assert energy_sources == ["Solar", "Wind", "Hydro"], f"Got {energy_sources}"
          assert len(energy_sources) == 3
        description: "energy_sources should contain Solar, Wind, Hydro in that order"
    hints:
