title: Lists and Dictionaries
description: Learn two essential Python data structures — lists for ordered collections and dictionaries for labelled key-value data.

exercises:

  - id: create_list
    title: Creating and Accessing Lists
    instructions: |
      A **list** in Python is a data structure used to store multiple items in a single variable. Think of it as a container that keeps things organised — like a box with numbered compartments.

      We use lists because instead of creating lots of separate variables:

      ```python
      Techno_1 = "Wind Energy"
      Techno_2 = "Solar Energy"
      Techno_3 = "Water Energy"
      ```

      We can store the same information in one object:

      ```python
      Technologies = ["Wind Energy", "Solar Energy", "Water Energy"]
      ```

      Accessing elements uses the **index** (position), which starts at **0**:

      ```python
      Technologies[0]   # "Wind Energy"   ← first element
      Technologies[1]   # "Solar Energy"  ← second element
      Technologies[-1]  # "Water Energy"  ← last element
      ```

      **Your task:**
      1. Create a list called `Technologies` with three items: `"Wind Energy"`, `"Solar Energy"`, `"Water Energy"`
      2. Print the **second** element (index 1)
      3. Print the **last** element using index `-1`
      4. Print the **total number** of items using `len()`
    starter_code: |
      Technologies = [        ]

      # Print the second element


      # Print the last element


      # Print the number of items


    tests:
      - type: output_contains
        value: "Solar Energy"
      - type: output_contains
        value: "Water Energy"
      - type: output_contains
        value: "3"
      - type: assert
        code: |
          assert Technologies == ["Wind Energy", "Solar Energy", "Water Energy"]
          assert len(Technologies) == 3
        description: "Technologies should have exactly these 3 items"
    hints:
      - "Technologies = [\"Wind Energy\", \"Solar Energy\", \"Water Energy\"]"
      - "print(Technologies[1])  # second element"
      - "print(Technologies[-1])  # last element"
      - "print(len(Technologies))  # count"
    solution: |
      Technologies = ["Wind Energy", "Solar Energy", "Water Energy"]

      print(Technologies[1])
      print(Technologies[-1])
      print(len(Technologies))

  - id: list_operations
    title: Building Lists Dynamically
    instructions: |
      You can start with an empty list and **append** items to it one by one:

      ```python
      # Creating an empty list
      my_list = []

      # Adding items with .append()
      my_list.append("Wind Energy")
      my_list.append("Solar Energy")
      ```

      This is useful when you are collecting results inside a loop, or building a list from multiple sources:

      ```python
      data_files = []
      data_files.append("pollution.csv")
      data_files.append("population.csv")
      data_files.append("gdp.json")
      ```

      **Your task:**
      1. Create an empty list called `energy_sources`
      2. Append these three items to it: `"Solar"`, `"Wind"`, `"Hydro"`
      3. Print the length of the list
      4. Print the last item using index `-1`
    starter_code: |
