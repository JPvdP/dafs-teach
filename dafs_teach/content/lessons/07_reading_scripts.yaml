      def calculate_co2_savings(car_emission, bus_emission, distance_km):
          car_total = car_emission * distance_km
          bus_total = bus_emission * distance_km
          savings   = car_total - bus_total
          return savings

      # Call the function with the values above
      distance_km = 50
      savings =

      print(f"Taking the bus instead of the car saves {savings} grams of CO2 over {distance_km} km.")
    tests:
      - type: output_contains
        value: "2600"
      - type: assert
        code: "assert savings == 2600, f'savings should be 2600, got {savings}'"
        description: "savings should be 2600"
    hints:
      - "savings = calculate_co2_savings(120, 68, distance_km)"
    solution: |
      def calculate_co2_savings(car_emission, bus_emission, distance_km):
          car_total = car_emission * distance_km
