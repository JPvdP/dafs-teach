    instructions: |
      Below is a function that calculates the CO₂ saved by taking the bus instead of the car for a given distance. Read each line carefully and make sure you understand what it computes.

      ```python
      def calculate_co2_savings(car_emission, bus_emission, distance_km):
          car_total = car_emission * distance_km
          bus_total = bus_emission * distance_km
          savings   = car_total - bus_total
          return savings
      ```

