    tests:
      - type: output_contains
        value: "Countries with high waste and no sustainable practices:"
      - type: output_contains
        value: "140.8"
      - type: assert
        code: |
          assert "Total_Score" in waste_data.columns
          assert abs(waste_data["Total_Score"].mean() - 140.8) < 0.1, f"Expected 140.8, got {waste_data['Total_Score'].mean()}"
        description: "Total_Score = Total_Waste * Recycling_Rate, mean = 140.8"
    hints:
      - "waste_data[\"Total_Score\"] = waste_data[\"Total_Waste\"] * waste_data[\"Recycling_Rate\"]"
      - "Verify: CountryA = 2.5 * 65 = 162.5, CountryB = 1.8 * 30 = 54.0, ..."
