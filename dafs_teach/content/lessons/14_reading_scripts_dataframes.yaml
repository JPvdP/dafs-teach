title: "Reading Scripts: Working With DataFrames"
description: "Practice reading and extending Python scripts that combine DataFrames, filtering, groupby and merging — the types of questions you may encounter in the exam."

exercises:

  - id: waste_management
    title: "Waste Management Analysis"
    instructions: |
      Read the following script carefully. For each line, make sure you understand what it does before moving on.

      ```python
      import pandas as pd

      waste_data = pd.DataFrame({
          "Country":        ["CountryA", "CountryB", "CountryC", "CountryD", "CountryE"],
          "Total_Waste":    [2.5, 1.8, 4.0, 3.1, 1.2],   # tons per capita
          "Recycling_Rate": [65, 30, 50, 85, 20],          # percentage
      })

      # Assign a default Waste_Level, then overwrite for Low and High
      waste_data["Waste_Level"] = "Moderate"
      waste_data.loc[waste_data["Total_Waste"] < 2,  "Waste_Level"] = "Low"
      waste_data.loc[waste_data["Total_Waste"] > 3,  "Waste_Level"] = "High"

      # Mark countries with recycling rate above 50% as sustainable
      waste_data["Sustainable_Practices"] = "No"
      waste_data.loc[waste_data["Recycling_Rate"] > 50, "Sustainable_Practices"] = "Yes"

      # Find countries with high waste AND no sustainable practices
      high_waste_no_recycling = waste_data[
          (waste_data["Waste_Level"] == "High") & (waste_data["Sustainable_Practices"] == "No")
      ]
      print("Countries with high waste and no sustainable practices:")
      print(high_waste_no_recycling)
      ```

      **Your task:**
      Run the script above, then extend it by:
      1. Adding a column `"Total_Score"` = `Total_Waste * Recycling_Rate`
      2. Printing the **mean** of `Total_Score` rounded to 1 decimal place

      The expected mean is **140.8**.
