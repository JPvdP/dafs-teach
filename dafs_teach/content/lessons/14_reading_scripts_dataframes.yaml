    tests:
      - type: output_contains
        value: "North"
      - type: assert
        code: |
          assert best_region == "North", f"Expected North, got {best_region}"
        description: "best_region should be North — highest utilisation rate in 2021"
    hints:
      - "The DataFrame is already sorted descending by utilization_rate"
      - "merged[\"region\"].iloc[0] gives the region in the first (highest) row"
    solution: |
      import pandas as pd

      wind = pd.DataFrame({
          "region":         ["North","North","South","South","East","East"],
          "year":           [2020, 2021, 2020, 2021, 2020, 2021],
          "generation_mwh": [13000, 14500, 6000, 6500, 9500, 10000],
      })
      capacity = pd.DataFrame({
          "region":      ["North", "South", "East"],
          "capacity_mw": [5, 3, 4],
      })

      wind_year = wind.groupby(["region", "year"], as_index=False)["generation_mwh"].sum()
      wind_year = wind_year.rename(columns={"generation_mwh": "total_generation"})

      merged = pd.merge(wind_year, capacity, on="region", how="left")
      merged["utilization_rate"] = merged["total_generation"] / (merged["capacity_mw"] * 8760)
      merged = merged.sort_values(by="utilization_rate", ascending=False)

      print(merged.head(5))

      best_region = merged["region"].iloc[0]
      print(best_region)
