    tests:
      - type: output_contains
        value: "Germany"
      - type: assert
        code: |
          assert best_country == "Germany", f"Expected Germany, got {best_country}"
        description: "best_country should be Germany (avg 3500 MWh across all years)"
    hints:
      - "Use solar_data (all years), not recent_data"
      - "solar_data.groupby(\"country\")[\"production_mwh\"].mean() gives average per country"
      - "Add .idxmax() to get the name of the country with the highest average"
    solution: |
      import pandas as pd

      solar_data = pd.DataFrame({
          "country":        ["Netherlands"]*3 + ["Germany"]*3 + ["France"]*3,
          "date":           ["2017-01-01","2018-01-01","2019-01-01"] * 3,
          "production_mwh": [1200, 1500, 1800, 3000, 3500, 4000, 2000, 2200, 2500],
      })

      solar_data = solar_data[["country", "date", "production_mwh"]]
      solar_data["year"] = pd.to_datetime(solar_data["date"]).dt.year

      country_year = solar_data.groupby(["country", "year"], as_index=False)["production_mwh"].mean()
      country_year = country_year.rename(columns={"production_mwh": "avg_production"})

      recent_data = country_year[country_year["year"] >= 2018]
      print(recent_data)

      best_country = solar_data.groupby("country")["production_mwh"].mean().idxmax()
      print(best_country)

  - id: wind_utilization
    title: "Wind Energy Utilisation Rate"
    instructions: |
      The script below merges two datasets — wind generation and installed capacity — to compute a **utilisation rate** for each region:

      ```
      utilisation_rate = total_generation / (capacity_mw × 8760 hours/year)
      ```

      A rate of `1.0` means the turbines ran at full power every hour of the year. In practice, rates of 0.25–0.40 are typical for wind.

      In a real pipeline this would use `pd.read_csv()` for both datasets. Here we provide the data inline. Read each line carefully:

      ```python
      import pandas as pd

      wind = pd.DataFrame({
          "region":         ["North","North","South","South","East","East"],
          "year":           [2020, 2021, 2020, 2021, 2020, 2021],
          "generation_mwh": [13000, 14500, 6000, 6500, 9500, 10000],
      })
      capacity = pd.DataFrame({
          "region":      ["North", "South", "East"],
          "capacity_mw": [5, 3, 4],
      })

      wind_year = wind.groupby(["region", "year"], as_index=False)["generation_mwh"].sum()
      wind_year = wind_year.rename(columns={"generation_mwh": "total_generation"})

      merged = pd.merge(wind_year, capacity, on="region", how="left")
      merged["utilization_rate"] = merged["total_generation"] / (merged["capacity_mw"] * 8760)
      merged = merged.sort_values(by="utilization_rate", ascending=False)

      print(merged.head(5))
      ```

      **Your task:**
      Run the script above, then find and print the **region with the highest utilisation rate**. Store it in `best_region` and print it.

      Expected answer: `North`
