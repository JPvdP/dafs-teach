      print(round(waste_data["Total_Score"].mean(), 1))

  - id: solar_production
    title: "Average Solar Energy Production"
    instructions: |
      In a real pipeline, this script would load data from a CSV file using `pd.read_csv("solar_production.csv")`. Below is that same script adapted to use a DataFrame directly, so you can run it without needing an external file. The logic is identical.

      Read each line carefully:

      ```python
      import pandas as pd

      # In a real project this would be: solar_data = pd.read_csv("data/solar_production.csv")
      solar_data = pd.DataFrame({
          "country":        ["Netherlands"]*3 + ["Germany"]*3 + ["France"]*3,
          "date":           ["2017-01-01","2018-01-01","2019-01-01"] * 3,
          "production_mwh": [1200, 1500, 1800, 3000, 3500, 4000, 2000, 2200, 2500],
      })

      solar_data = solar_data[["country", "date", "production_mwh"]]
      solar_data["year"] = pd.to_datetime(solar_data["date"]).dt.year

      country_year = solar_data.groupby(["country", "year"], as_index=False)["production_mwh"].mean()
      country_year = country_year.rename(columns={"production_mwh": "avg_production"})

      recent_data = country_year[country_year["year"] >= 2018]
      print(recent_data)
      ```

      **Your task:**
      Run the script above, then find and print the **country with the highest overall average production** across all years. Store the result in `best_country` and print it.

      Expected answer: `Germany`
