          assert first_quarter == [80, 65, 70], f"Expected [80, 65, 70], got {first_quarter}"
          assert last_quarter == [60, 75, 90], f"Expected [60, 75, 90], got {last_quarter}"
          assert rainfall_range == 70, f"Expected range 70, got {rainfall_range}"
        description: "first_quarter=[80,65,70], last_quarter=[60,75,90], range=70"
    hints:
      - "monthly_rainfall[:3], stop at index 3 (not included)"
      - "monthly_rainfall[-3:], start 3 positions from the end"
      - "rainfall_range = max(monthly_rainfall) - min(monthly_rainfall)"
      - "print(f\"Range: {rainfall_range} mm\")"
    solution: |
      monthly_rainfall = [80, 65, 70, 55, 40, 30, 20, 25, 45, 60, 75, 90]

      first_quarter = monthly_rainfall[:3]
      print(f"First quarter: {first_quarter}")

      last_quarter = monthly_rainfall[-3:]
      print(f"Last quarter: {last_quarter}")

      sorted_rainfall = sorted(monthly_rainfall)
      print(f"Sorted: {sorted_rainfall}")

      rainfall_range = max(monthly_rainfall) - min(monthly_rainfall)
      print(f"Range: {rainfall_range} mm")
