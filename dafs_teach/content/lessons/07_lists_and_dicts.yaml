      Given 12 monthly rainfall totals (Jan-Dec, in mm):
      1. Create `first_quarter`, the first 3 months, and print it with an f-string as: `First quarter: [80, 65, 70]`
      2. Create `last_quarter`, the last 3 months, using a negative start index, and print it as: `Last quarter: [60, 75, 90]`
      3. Create `sorted_rainfall = sorted(monthly_rainfall)` and print it as: `Sorted: [20, 25, 30, ...]`
      4. Compute `rainfall_range` (wettest minus driest month) and print it as: `Range: 70 mm`
    starter_code: |
      monthly_rainfall = [80, 65, 70, 55, 40, 30, 20, 25, 45, 60, 75, 90]

      # 1. First 3 months (Jan-Mar), then print "First quarter: ..."
      first_quarter = []


      # 2. Last 3 months (Oct-Dec), use a negative start index, then print "Last quarter: ..."
      last_quarter = []


      # 3. All months sorted driest to wettest, then print "Sorted: ..."


      # 4. Range: wettest minus driest, then print "Range: ... mm"
      rainfall_range = 0

    tests:
      - type: output_contains
        value: "First quarter: [80, 65, 70]"
      - type: output_contains
        value: "Last quarter: [60, 75, 90]"
      - type: output_contains
        value: "Sorted: [20, 25, 30, 40, 45, 55, 60, 65, 70, 75, 80, 90]"
      - type: output_contains
        value: "Range: 70 mm"
