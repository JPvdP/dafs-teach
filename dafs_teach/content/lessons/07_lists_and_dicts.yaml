  - id: practice_create_dict
    title: "Practice: Creating Dictionaries"
    instructions: |
      More practice creating and looking up values in a dictionary.

      **Watch the quotes in f-strings.** When you look up a key inside an f-string, use **single quotes** for the key if the f-string itself uses double quotes:

      ```python
      prices = {"Solar": 120}
      print(f"Solar costs {prices['Solar']} euros")    # works
      print(f"Solar costs {prices["Solar"]} euros")    # SyntaxError in older Python versions
      ```

      Python only sees where the text ends by looking at the quotes, so `"` inside `"..."` confuses it (only Python 3.12 and newer accept it). Single quotes inside always work.

      **Your task:**
      1. Create a dictionary `material_recyclability` with these key-value pairs:
         - `"Steel"` → `90`
         - `"Aluminum"` → `95`
         - `"Copper"` → `85`
      2. Print the recyclability of `"Steel"` with an f-string as: `Steel: 90% recyclable`
      3. Print the recyclability of `"Aluminum"` as: `Aluminum: 95% recyclable`
    starter_code: |
      material_recyclability = {
          # add your key-value pairs here
      }

      # Print "Steel: ...% recyclable"


      # Print "Aluminum: ...% recyclable"

    tests:
      - type: output_equals
        value: "Steel: 90% recyclable\nAluminum: 95% recyclable"
      - type: assert
        code: |
          assert material_recyclability["Steel"] == 90
          assert material_recyclability["Aluminum"] == 95
          assert material_recyclability["Copper"] == 85
        description: "Dictionary should have Steel=90, Aluminum=95, Copper=85"
    hints:
      - "\"Steel\": 90, note the colon between key and value"
      - "print(f\"Steel: {material_recyclability['Steel']}% recyclable\"), with single quotes around Steel"
    solution: |
      material_recyclability = {
          "Steel": 90,
          "Aluminum": 95,
          "Copper": 85,
      }

      print(f"Steel: {material_recyclability['Steel']}% recyclable")
      print(f"Aluminum: {material_recyclability['Aluminum']}% recyclable")

