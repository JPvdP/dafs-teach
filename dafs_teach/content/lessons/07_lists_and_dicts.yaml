title: Lists and Dictionaries
description: Learn two essential Python data structures, lists for ordered collections and dictionaries for labelled key-value data.

exercises:

  - id: dict_iteration
    title: "Iterating Over a Dictionary"
    instructions: |
      You can loop over all key-value pairs in a dictionary using `.items()`, which gives you both the key and the value on each iteration:

      ```python
      capitals = {"NL": "Amsterdam", "DE": "Berlin", "FR": "Paris"}

      for country, capital in capitals.items():
          print(f"The capital of {country} is {capital}")
      ```

      ```
      The capital of NL is Amsterdam
      The capital of DE is Berlin
      The capital of FR is Paris
      ```

      This pattern is very common when you need to process or display every entry.

      **Printing with f-strings**

      In this lesson you print your results with **f-strings**, which you learned in lesson 5: put an `f` before the quotes, and the variables inside `{}`. That way your output says what each number means, instead of showing a bare number.

      **Your task:**
      Given the dictionary of annual CO₂ emissions (in millions of tons) below:
      1. Loop over `.items()` and, with an f-string, print each line as: `DE emitted 680 Mt of CO2`
      2. In the same loop, add each amount to `total`
      3. After the loop, print the total with an f-string as: `Total: 1760 Mt`
    starter_code: |
      emissions = {
          "NL": 150,
          "DE": 680,
          "FR": 310,
          "ES": 230,
          "PL": 390,
      }

      total = 0
      for country, amount in emissions.items():
          # 1. Print "<country> emitted <amount> Mt of CO2" with an f-string

          # 2. Add amount to total
          total += 0

      # 3. Print "Total: <total> Mt" with an f-string

    tests:
      - type: output_contains
        value: "NL emitted 150 Mt of CO2"
      - type: output_contains
        value: "DE emitted 680 Mt of CO2"
      - type: output_contains
        value: "Total: 1760 Mt"
      - type: assert
        code: |
          assert total == 1760, f"Expected total 1760, got {total}"
        description: "total must equal 1760 (sum of all emissions)"
    hints:
      - "print(f\"{country} emitted {amount} Mt of CO2\"), inside the for loop"
      - "total += amount, inside the for loop"
      - "print(f\"Total: {total} Mt\"), after the loop (not indented)"
    solution: |
      emissions = {
          "NL": 150,
          "DE": 680,
          "FR": 310,
          "ES": 230,
          "PL": 390,
      }

      total = 0
      for country, amount in emissions.items():
          print(f"{country} emitted {amount} Mt of CO2")
          total += amount

      print(f"Total: {total} Mt")

  - id: list_slicing
    title: "List Slicing and Sorting"
    instructions: |
      Python lists support **slicing** to extract a sub-sequence: `my_list[start:stop]`, `start` is included, `stop` is excluded. Leaving either side blank means "from the beginning" or "to the end":

      ```python
      temps = [22, 15, 30, 8, 25]
      print(temps[:3])    # [22, 15, 30], first 3
      print(temps[2:])    # [30, 8, 25], from index 2 onwards
      print(temps[-2:])   # [8, 25], last 2 (negative = count from end)
      ```

      `sorted(my_list)` returns a new sorted list without changing the original.

      An f-string can show a whole list too: `print(f"Warmest days: {temps[:3]}")` prints `Warmest days: [22, 15, 30]`.

      **Your task:**
      Given 12 monthly average temperatures (Jan-Dec):
      1. Create `first_quarter`, the first 3 months, and print it with an f-string as: `First quarter: [3, 5, 10]`
      2. Create `last_quarter`, the last 3 months, using a negative start index, and print it as: `Last quarter: [14, 7, 4]`
      3. Create `sorted_temps = sorted(monthly_temps)` and print it as: `Sorted: [3, 4, 5, ...]`
      4. Compute `temp_range` (warmest minus coldest month, with `max()` and `min()`) and print it as: `Range: 25`
    starter_code: |
      monthly_temps = [3, 5, 10, 15, 20, 25, 28, 27, 22, 14, 7, 4]

      # 1. First 3 months (Jan-Mar), then print "First quarter: ..."
      first_quarter = []


      # 2. Last 3 months (Oct-Dec), use a negative start index, then print "Last quarter: ..."
      last_quarter = []


      # 3. All months sorted coldest to warmest, then print "Sorted: ..."
      sorted_temps = sorted(monthly_temps)


      # 4. Range: warmest minus coldest, then print "Range: ..."
      temp_range = 0

    tests:
      - type: output_contains
        value: "First quarter: [3, 5, 10]"
      - type: output_contains
        value: "Last quarter: [14, 7, 4]"
      - type: output_contains
        value: "Sorted: [3, 4, 5, 7, 10, 14, 15, 20, 22, 25, 27, 28]"
      - type: output_contains
        value: "Range: 25"
      - type: assert
        code: |
          assert first_quarter == [3, 5, 10], f"Expected [3, 5, 10], got {first_quarter}"
          assert last_quarter == [14, 7, 4], f"Expected [14, 7, 4], got {last_quarter}"
          assert temp_range == 25, f"Expected range 25, got {temp_range}"
        description: "first_quarter=[3,5,10], last_quarter=[14,7,4], range=25"
    hints:
      - "monthly_temps[:3], stop at index 3 (not included)"
      - "monthly_temps[-3:], start 3 positions from the end"
      - "temp_range = max(monthly_temps) - min(monthly_temps)"
      - "print(f\"First quarter: {first_quarter}\"), and the same pattern for the other three"
    solution: |
      monthly_temps = [3, 5, 10, 15, 20, 25, 28, 27, 22, 14, 7, 4]

      first_quarter = monthly_temps[:3]
      print(f"First quarter: {first_quarter}")

      last_quarter = monthly_temps[-3:]
      print(f"Last quarter: {last_quarter}")

      sorted_temps = sorted(monthly_temps)
      print(f"Sorted: {sorted_temps}")

      temp_range = max(monthly_temps) - min(monthly_temps)
      print(f"Range: {temp_range}")

