    hints:
      - "df[\"renewable_percentage\"] = df[\"renewable_energy\"] / df[\"total_energy\"] * 100"
      - "df.at[index, \"renewable_category\"] = \"Medium Renewable\" in the elif block"
      - "df.at[index, \"renewable_category\"] = \"Low Renewable\" in the else block"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "country":          ["NL", "DE", "FR", "ES", "PL"],
          "renewable_energy": [15,   40,   60,   25,    5],
          "total_energy":     [100,  100,  100,  100,  100],
      })

      df["renewable_percentage"] = df["renewable_energy"] / df["total_energy"] * 100

      for index, row in df.iterrows():
          if row["renewable_percentage"] > 50:
              df.at[index, "renewable_category"] = "High Renewable"
          elif row["renewable_percentage"] >= 20:
              df.at[index, "renewable_category"] = "Medium Renewable"
          else:
              df.at[index, "renewable_category"] = "Low Renewable"

      print(df)
      print(df["renewable_category"].value_counts())
