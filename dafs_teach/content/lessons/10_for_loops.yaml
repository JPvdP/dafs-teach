title: For Loops
description: Learn how to automate repetitive tasks with for loops — iterating over ranges, lists, and using enumerate, custom steps, and break.

exercises:

  - id: range_basics
    title: "Looping with range() — and Indentation"
    instructions: |
      Loops are a fundamental part of programming in data science because they allow you to efficiently perform repetitive tasks on large datasets. Instead of writing repetitive code manually, loops enable automation by iterating over data structures.

      A `for` loop in Python starts with the `for` operator, followed by a variable name, the `in` keyword, and a sequence. The loop body must be **indented**:

      ```python
      for i in range(5):
          print("Iteration", i)
      ```

      This prints `Iteration 0` through `Iteration 4` — `range(5)` produces the numbers 0, 1, 2, 3, 4.

      **Indentation matters.** Only the indented code runs inside the loop. Code at the same level as `for` runs once, after the loop finishes:

      ```python
      for i in range(5):
          print("Indented", i)    # runs 5 times
      print("Not Indented", i)   # runs once, after the loop (i = 4)
      ```

      **Your task:**
      Write a loop using `range(5)` that:
      1. Prints `"Iteration 0"` through `"Iteration 4"` inside the loop
      2. After the loop, prints `"Loop finished"` (outside/not indented)
    starter_code: |
      for i in range(5):
          # print inside the loop


      # print outside the loop

    tests:
      - type: output_equals
        value: "Iteration 0\nIteration 1\nIteration 2\nIteration 3\nIteration 4\nLoop finished"
    hints:
      - "print(\"Iteration\", i) inside the loop"
      - "print(\"Loop finished\") with no indentation after the loop"
    solution: |
      for i in range(5):
          print("Iteration", i)

      print("Loop finished")

  - id: loop_list
    title: "Looping over a List"
    instructions: |
      You can loop over any sequence — not just numbers. Looping over a **list** is extremely common in data analysis, since datasets are often stored as lists of items:

      ```python
      fruits = ["apple", "banana", "cherry", "date"]

      for fruit in fruits:
          print("I like", fruit)
      ```

      The variable `fruit` takes each value from the list in turn. You can name it anything — just be consistent inside the loop.

      **Your task:**
      1. Create the list `fruits = ["apple", "banana", "cherry", "date"]`
      2. Loop over it and print `"I like apple"`, `"I like banana"`, etc.
    starter_code: |
      fruits = ["apple", "banana", "cherry", "date"]

      for fruit in fruits:
          # print the message

    tests:
      - type: output_equals
        value: "I like apple\nI like banana\nI like cherry\nI like date"
    hints:
      - "print(\"I like\", fruit)"
    solution: |
      fruits = ["apple", "banana", "cherry", "date"]

      for fruit in fruits:
          print("I like", fruit)

  - id: enumerate_step
    title: "Enumerate and Custom Steps"
    instructions: |
      **`enumerate()`** lets you loop over a list and get both the **index** and the **value** at the same time:

      ```python
      languages = ["Python", "Java", "C++", "Ruby"]

      for i, language in enumerate(languages):
          print("Language", i + 1, "is", language)
      ```

      This prints:
      ```
      Language 1 is Python
      Language 2 is Java
      ...
      ```

      **`range(start, stop, step)`** lets you control the step size:

      ```python
      for number in range(1, 11, 2):
          print("Odd number:", number)
      ```

      This prints odd numbers: 1, 3, 5, 7, 9.

      **Your task:**
      1. Use `enumerate` to loop over `languages = ["Python", "Java", "C++", "Ruby"]` and print `"Language 1 is Python"` etc.
      2. Then use `range(1, 11, 2)` to print odd numbers from 1 to 9.
    starter_code: |
      languages = ["Python", "Java", "C++", "Ruby"]

      # Loop with enumerate
      for i, language in enumerate(languages):
          # print "Language X is Y"


      # Loop with custom step
      for number in range(1, 11, 2):
          # print "Odd number: X"

    tests:
      - type: output_contains
        value: "Language 1 is Python"
      - type: output_contains
        value: "Language 4 is Ruby"
      - type: output_contains
        value: "Odd number: 1"
      - type: output_contains
        value: "Odd number: 9"
      - type: assert
        code: |
          # verify enumerate works correctly (index starts at 1)
          results = []
          for i, lang in enumerate(["Python", "Java", "C++", "Ruby"]):
              results.append(i + 1)
          assert results == [1, 2, 3, 4]
        description: "enumerate should produce indices 0,1,2,3 → displayed as 1,2,3,4"
    hints:
      - "print(\"Language\", i + 1, \"is\", language)"
      - "print(\"Odd number:\", number)"
    solution: |
      languages = ["Python", "Java", "C++", "Ruby"]

      for i, language in enumerate(languages):
          print("Language", i + 1, "is", language)

      for number in range(1, 11, 2):
          print("Odd number:", number)

  - id: break_loop
    title: "The break Statement"
    instructions: |
      Sometimes you want to **stop a loop early** when a specific condition is met. The `break` statement exits the loop immediately:

      ```python
      numbers = [3, 7, 1, 9, 4, 2]

      for num in numbers:
          if num == 9:
              print("Found 9. Exiting the loop.")
              break
          print("Processing", num)
      ```

      Output:
      ```
      Processing 3
      Processing 7
      Processing 1
      Found 9. Exiting the loop.
      ```

      The numbers `4` and `2` are **never reached** because `break` exits before them.

      **Your task:**
      Run the code above. Then extend it: after the loop, print `"Done"` to confirm the loop has ended.
    starter_code: |
      numbers = [3, 7, 1, 9, 4, 2]

      for num in numbers:
          if num == 9:
              print("Found 9. Exiting the loop.")
              break
          print("Processing", num)

      # Print "Done" after the loop

    tests:
      - type: output_equals
        value: "Processing 3\nProcessing 7\nProcessing 1\nFound 9. Exiting the loop.\nDone"
    hints:
      - "print(\"Done\") with no indentation — it runs after the loop regardless of break"
    solution: |
      numbers = [3, 7, 1, 9, 4, 2]

      for num in numbers:
          if num == 9:
              print("Found 9. Exiting the loop.")
              break
          print("Processing", num)

      print("Done")

  - id: accumulator_loop
    title: "Accumulating Results — Total and Maximum"
    instructions: |
      A very common loop pattern is the **accumulator**: you initialise a value before the loop and update it on each iteration. The same pattern works for sums, maximums, and more:

      ```python
      numbers = [4, 9, 2, 7, 5]
      total = 0
      max_val = numbers[0]

      for num in numbers:
          total += num
          if num > max_val:
              max_val = num

      print(total, max_val)   # 27  9
      ```

      **Your task:**
      Given 12 monthly rainfall values (mm), use a `for` loop with `enumerate` to:
      1. Compute `total_rain` — the sum of all monthly values
      2. Track `max_rain` — the highest monthly value
      3. Track `max_month` — the **1-based** month number with the highest rainfall

      Expected output:
      ```
      Total rainfall: 720 mm
      Wettest month: 4 with 95 mm
      ```
    starter_code: |
      rainfall = [45, 60, 80, 95, 75, 40, 30, 35, 55, 85, 70, 50]

      total_rain = 0
      max_rain = rainfall[0]
      max_month = 1

      for i, rain in enumerate(rainfall):
          # add rain to total_rain

          if rain > max_rain:
              # update max_rain and max_month (use i + 1 for 1-based month number)


      print(f"Total rainfall: {total_rain} mm")
      print(f"Wettest month: {max_month} with {max_rain} mm")
    tests:
      - type: output_contains
        value: "Total rainfall: 720 mm"
      - type: output_contains
        value: "Wettest month: 4 with 95 mm"
      - type: assert
        code: |
          assert total_rain == 720, f"Expected 720, got {total_rain}"
          assert max_rain == 95, f"Expected max 95, got {max_rain}"
          assert max_month == 4, f"Expected month 4, got {max_month}"
        description: "total=720, max=95 in month 4 (April)"
    hints:
      - "total_rain += rain — add each value to the running total"
      - "max_rain = rain and max_month = i + 1 inside the if block"
    solution: |
      rainfall = [45, 60, 80, 95, 75, 40, 30, 35, 55, 85, 70, 50]

      total_rain = 0
      max_rain = rainfall[0]
      max_month = 1

      for i, rain in enumerate(rainfall):
          total_rain += rain
          if rain > max_rain:
              max_rain = rain
              max_month = i + 1

      print(f"Total rainfall: {total_rain} mm")
      print(f"Wettest month: {max_month} with {max_rain} mm")

  - id: nested_combinations
    title: "Nested For Loops — All Combinations"
    instructions: |
      Nested `for` loops pair every element of one list with every element of another — generating all combinations. The inner loop runs completely for every single step of the outer loop:

      ```python
      colors = ["red", "blue"]
      sizes  = ["S", "M", "L"]

      for color in colors:
          for size in sizes:
              print(color, size)
      ```

      This produces 6 lines (2 × 3): `red S`, `red M`, `red L`, `blue S`, etc.

      **Your task:**
      1. Use nested `for` loops to print all combinations of `regions` and `products` in the format `"North - Solar"`
      2. Count every combination in a variable `count`
      3. Print `"Total combinations: 12"` at the end
    starter_code: |
      regions  = ["North", "South", "East", "West"]
      products = ["Solar", "Wind", "Hydro"]

      count = 0
      for region in regions:
          for product in products:
              # print the combination in format "North - Solar"

              # increment count

      print(f"Total combinations: {count}")
    tests:
      - type: output_contains
        value: "North - Solar"
      - type: output_contains
        value: "West - Hydro"
      - type: output_contains
        value: "Total combinations: 12"
      - type: assert
        code: |
          assert count == 12, f"Expected 12 combinations (4x3), got {count}"
        description: "4 regions x 3 products = 12 combinations"
    hints:
      - "print(f\"{region} - {product}\") inside the inner loop"
      - "count += 1 inside the inner loop — one per combination"
    solution: |
      regions  = ["North", "South", "East", "West"]
      products = ["Solar", "Wind", "Hydro"]

      count = 0
      for region in regions:
          for product in products:
              print(f"{region} - {product}")
              count += 1

      print(f"Total combinations: {count}")
