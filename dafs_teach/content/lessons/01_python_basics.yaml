  - id: text_number_boolean
    title: "Text, Numbers, and Booleans"
    instructions: |
      Not all values are the same kind of thing. Python calls the "kind" of a value its **type**. The three types you'll use constantly are:

      | Type | What it is | How you write it | Example |
      |------|-----------|-------------------|---------|
      | text (`str`) | A piece of text | Between quotes `"..."` | `"hello"` |
      | number (`int`/`float`) | A whole or decimal number | Just the digits, no quotes | `42` or `3.14` |
      | boolean (`bool`) | True or False | Exactly `True` or `False` — capital letter, no quotes | `True` |

      The quotes matter a lot: `5` is a number you can do math with, but `"5"` is text — Python treats it completely differently (more on that in the next exercise).

      Booleans represent yes/no or on/off situations — for example "is the course open for enrollment? `True`".

