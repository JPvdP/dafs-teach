  - id: numpy_matrix
    title: "Creating a NumPy Matrix"
    instructions: |
      Typing out every value with `np.array()` works for small arrays. But often you want a matrix of a certain size, filled with a starting value. numpy has a function for that: `np.zeros()` creates a matrix filled with zeros.

      ```python
      import numpy as np

      small_matrix = np.zeros((3, 3))
      print(small_matrix)
      ```

      ```
      [[0. 0. 0.]
       [0. 0. 0.]
       [0. 0. 0.]]
      ```

      (The dot in `0.` means these are decimal numbers: `0.0`.)

      **Why the double parentheses `(( ))`?**

      Each pair of round brackets has a different job:
      - The **outer** brackets `np.zeros( ... )` belong to the function call, just like `np.array( ... )` in the previous exercise
      - The **inner** brackets `(3, 3)` are the **argument**: the size of the matrix, written as *(rows, columns)*, just like the `(2, 3)` you saw in the previous exercise

      A pair of values in round brackets like `(3, 3)` is called a **tuple**. It's similar to a list, but you can't change it afterwards. `np.zeros()` expects the whole size as **one** argument, so the rows and columns have to be grouped together in their own brackets.

      If you forget the inner brackets and write `np.zeros(3, 3)`, numpy reads that as two separate arguments, and you get `TypeError: Cannot interpret '3' as a data type`.

      Another example — 2 rows and 4 columns:

      ```python
      print(np.zeros((2, 4)))
      ```

      ```
      [[0. 0. 0. 0.]
       [0. 0. 0. 0.]]
      ```

      **Your task:**
      1. Import `numpy` as `np`
      2. Create a matrix of zeros with **2 rows and 5 columns**, stored in a variable called `small_matrix`
      3. Print `small_matrix`
    starter_code: |
      import numpy as np

      # Create a matrix of zeros with 2 rows and 5 columns
      small_matrix =

      print(small_matrix)
    tests:
      - type: output_contains
        value: "0."
      - type: assert
        code: |
          assert small_matrix.shape != (5, 2), 'You swapped rows and columns: the size is written as (rows, columns)'
          assert small_matrix.shape == (2, 5), f'small_matrix should have 2 rows and 5 columns, but it has {small_matrix.shape[0]} rows and {small_matrix.shape[1]} columns'
          assert (small_matrix == 0).all(), 'all values in the matrix should be zero'
        description: "small_matrix should be a matrix of zeros with 2 rows and 5 columns"
    hints:
      - "np.zeros() creates a matrix of zeros"
      - "The size goes in its own brackets, rows first: (2, 5)"
      - "small_matrix = np.zeros((2, 5))"
    solution: |
      import numpy as np

      small_matrix = np.zeros((2, 5))
      print(small_matrix)

  - id: matrix_operations
    title: "Matrix Operations: Overwrite or Keep?"
    instructions: |
      Just like with numbers, you can do math on a whole matrix at once — the operation is applied to every value, as you saw with arrays.

      Remember from the "Overwriting Variables" exercise that assigning to an existing name replaces its old value. With matrices (and later with data tables) you always have a choice: **overwrite** the original variable, or **create a new one**.

      ```python
      # Overwrites small_matrix — the original (all zeros) is lost
      small_matrix = small_matrix + 3

      # Creates a new variable — both the original and the new one are kept
      small_matrix_3 = small_matrix + 3
      ```

      If you write the same name on both sides of the `=`, the variable is replaced. If you want to keep both versions, create a new variable with a different name. When working with data, keeping the original around is often the safer choice: if something goes wrong, you can compare with it, or start again from it.

