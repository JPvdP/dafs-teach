      - type: assert
        code: |
          assert (small_matrix == 0).all(), 'small_matrix should still be all zeros — store the result under a new name instead of overwriting it'
          assert (small_matrix_5 == 5).all(), 'small_matrix_5 should be all fives'
          assert small_matrix_5.shape == (4, 4), 'small_matrix_5 should still be a 4x4 matrix'
        description: "small_matrix stays all zeros; small_matrix_5 is all fives"
    hints:
      - "Adding a number to a matrix adds it to every element"
      - "Store the result under the new name: small_matrix_5 = small_matrix + 5"
    solution: |
      import numpy as np

      small_matrix = np.zeros((4, 4))

      small_matrix_5 = small_matrix + 5

      print(small_matrix)
      print(small_matrix_5)

  - id: intro_dictionaries
    title: "Dictionaries: Values With Labels"
    instructions: |
      A list keeps values **in order**, and you find them by position (`[0]`, `[1]`, …). Often it's more useful to find a value by a **name**. That's what a **dictionary** (`dict`) does: it stores pairs of a **key** (the label) and a **value**.

      You write a dictionary with curly brackets `{ }`, with `key: value` pairs separated by commas:

      ```python
      station = {
          "name": "De Bilt",
          "temperature": 14.3,
          "is_active": True,
      }
      ```

      You look up a value by putting its key in square brackets:

      ```python
      print(station["name"])          # De Bilt
      print(station["temperature"])   # 14.3
      ```

      And just like a normal variable, you can overwrite a value by assigning to its key:

      ```python
      station["temperature"] = 15.0
      ```

      **Why you need this for the next lesson:** the values in a dictionary can also be lists. A dictionary where every key is a column name and every value is a list of values is exactly how you'll build a pandas table (a *DataFrame*) in the next lesson:

      ```python
      data = {
          "city": ["Utrecht", "Amsterdam", "Rotterdam"],
          "bike_lanes_km": [420, 513, 300],
      }
      ```

      Read it as: "the column `city` contains these three values, the column `bike_lanes_km` contains those three values".

      **Your task:**
      1. Create a dictionary called `country` with three keys: `"name"` set to `"Netherlands"`, `"capital"` set to `"Amsterdam"`, and `"renewable_share"` set to `15`
      2. Print the value stored under `"name"`
      3. New figures are in: overwrite `"renewable_share"` with `17`
      4. Print the value stored under `"renewable_share"`
    starter_code: |
      # 1. Create the dictionary
      country = {

      }

      # 2. Print the name


      # 3. Update renewable_share to 17


      # 4. Print renewable_share

    tests:
      - type: output_equals
        value: "Netherlands\n17"
      - type: assert
        code: |
          assert isinstance(country, dict), 'country should be a dictionary, written with { }'
          assert country.get('name') == 'Netherlands', 'country["name"] should be "Netherlands"'
          assert country.get('capital') == 'Amsterdam', 'country["capital"] should be "Amsterdam"'
          assert country.get('renewable_share') == 17, 'country["renewable_share"] should be updated to 17'
        description: "country should have name, capital and renewable_share=17"
    hints:
      - "Inside the { }, write each pair as \"key\": value, separated by commas"
      - "country = {\"name\": \"Netherlands\", \"capital\": \"Amsterdam\", \"renewable_share\": 15}"
      - "Look up a value with print(country[\"name\"])"
      - "Overwrite a value with country[\"renewable_share\"] = 17"
    solution: |
      country = {
          "name": "Netherlands",
          "capital": "Amsterdam",
          "renewable_share": 15,
      }

      print(country["name"])

      country["renewable_share"] = 17

      print(country["renewable_share"])

  - id: reading_error_messages
    title: "Reading Error Messages"
    instructions: |
      Making mistakes is a normal part of programming — even experienced programmers see error messages every day. Learning to **read** one is one of the most useful skills you can build early on.

      Two very common beginner mistakes:

      **1. Mixing text and numbers**

      ```python
      age = 25
      print("Age: " + age)
      ```

      Running this gives:

      ```
      TypeError: can only concatenate str (not "int") to str
      ```

      Python is telling you that it tried to combine (`+`) text with a number, and doesn't know how to do that automatically. The fix is to convert the number to text first, with `str()`:

      ```python
      print("Age: " + str(age))
      ```

      **2. A missing bracket**

      ```python
      print("Hello"
      ```

      Running this gives:

      ```
      SyntaxError: '(' was never closed
      ```

      Python is telling you it found an opening `(` but never found the matching `)`. The fix is to make sure every bracket you open is closed.

      **Your task:**
      The code below has **two bugs**: a missing closing bracket, and text being combined with a number using `+`. Click Run, read the error message, fix the first bug, run again, read the next error, and fix that one too — until the code runs and prints `Price: 12`.
    starter_code: |
      price = 12

      print("Price: " + price
    tests:
      - type: output_equals
        value: "Price: 12"
    hints:
      - "Run the code first and read the red error message carefully — it names the problem and the line it's on"
      - "The first error is a SyntaxError: '(' was never closed. Add the missing closing parenthesis to the print() call"
      - "After fixing that, you'll get a TypeError — you can't add text and a number directly. Convert price to text first with str(price)"
      - "print(\"Price: \" + str(price))"
    solution: |
      price = 12

      print("Price: " + str(price))

  - id: reading_error_messages_nameerror
    title: "Reading Error Messages: NameError"
    instructions: |
      A tip for reading **any** error message: Python shows a lot of text, but the **last line** is the one that matters most. It always has the form `SomeErrorType: what went wrong`. Start there, then look up at the line number if you need more context.

      One very common error is the **NameError**. It happens when you use a name Python doesn't recognize as an existing variable — usually a typo, or text you forgot to put in quotes.

      ```python
      favorite_color = blue
      print(favorite_color)
      ```

      Running this gives:

      ```
      NameError: name 'blue' is not defined
      ```

      Without quotes, Python assumes `blue` is meant to be a variable — and since no variable called `blue` exists, it gives up. The fix is to add quotes, since `blue` was meant to be text:

      ```python
      favorite_color = "blue"
      ```

      A typo causes the exact same error:

      ```python
      score = 10
      print(scroe)   # typo!
      ```

      ```
      NameError: name 'scroe' is not defined
      ```

      **Your task:**
      The code below tries to print a city name, but has a `NameError` bug. Click Run, read the last line of the error message, and fix the code so it prints `Amsterdam`.
    starter_code: |
      city = Amsterdam

      print(city)
    tests:
      - type: output_equals
        value: "Amsterdam"
    hints:
      - "Run the code and read the last line of the error message — it names exactly which word Python couldn't find"
      - "NameError: name 'Amsterdam' is not defined means Python thinks Amsterdam is a variable, not text"
      - "Amsterdam was meant to be text — add quotes around it"
      - 'city = "Amsterdam"'
    solution: |
      city = "Amsterdam"

      print(city)

  - id: reading_error_messages_zerodivision
    title: "Reading Error Messages: ZeroDivisionError"
    instructions: |
      Just like in regular math, dividing by zero isn't allowed. Python raises a **ZeroDivisionError** when it happens:

      ```python
      total = 10
      people = 0
      average = total / people
      ```

      Running this gives:

      ```
      ZeroDivisionError: division by zero
      ```

      This error usually means a variable unexpectedly ended up being `0` — often because of a bug earlier in the code, or a case you didn't account for (like calculating an average before any data exists).

      **Your task:**
      The code below calculates the average score of a class, but `n_students` has a bug — there are actually 5 students, not 0. Click Run, read the error message, and fix it so the code prints the correct average, `18.0`.
    starter_code: |
      total_score = 90
      n_students = 0

      average = total_score / n_students
      print(average)
    tests:
      - type: output_equals
        value: "18.0"
      - type: assert
        code: "assert n_students == 5, 'n_students should be 5, not 0'"
        description: "n_students should equal 5"
    hints:
      - "Run the code and read the last line of the error message — ZeroDivisionError: division by zero means one of your numbers is 0 where it shouldn't be"
      - "n_students is currently 0 — that's the bug, not the division itself"
      - "There are 5 students in the class"
      - "n_students = 5"
    solution: |
      total_score = 90
      n_students = 5

      average = total_score / n_students
      print(average)
