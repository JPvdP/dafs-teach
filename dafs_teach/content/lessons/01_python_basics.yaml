  - id: numpy_arrays
    title: "NumPy Arrays: Lists Built for Math"
    instructions: |
      In the previous exercise you stored many values in a list. Lists are great for *keeping* values together, but they're not built for math. Look what happens:

      ```python
      prices = [10, 20, 30]

      prices * 2   # [10, 20, 30, 10, 20, 30] — the list is repeated, just like text!
      prices + 5   # TypeError: can only concatenate list (not "int") to list
      ```

      For calculations, we use a **NumPy array** instead. An array looks a lot like a list, but math is applied to **every value** in it:

      ```python
      import numpy as np

      prices = np.array([10, 20, 30])

      print(prices * 2)   # [20 40 60]
      print(prices + 5)   # [15 25 35]
      ```

      **Calling a function from a package: `np.`**

      `array()` is a function that lives in the numpy package. To use it, you write the package's short name, a **dot**, and the function name:

      ```python
      np.array( ... )
      ```

      Read the dot as **"from"**: `np.array` means *"the `array` function **from** numpy"*. The `np.` part tells Python which toolbox to look in. If you leave it out and write just `array( ... )`, Python doesn't know where to find it, and you get `NameError: name 'array' is not defined`. Every numpy function works this way — and in the next lesson, pandas works exactly the same: `pd.DataFrame( ... )`.

      **What goes between the parentheses?**

      Look closely at `np.array([10, 20, 30])`. There are two kinds of brackets:
      - The round brackets `( )` belong to the **function call**, just like in `print( )`
      - The square brackets `[ ]` are the **list** you hand to the function

      The value you give a function between its parentheses is called an **argument**. Here, the argument is a list, and `np.array()` turns that list into an array.

      **Arrays with rows and columns**

      An array can also have rows and columns, like a grid. That's called a **matrix**. You make one from a list of lists, where each inner list is one row:

      ```python
      grid = np.array([[1, 2, 3],
                       [4, 5, 6]])
      print(grid)
      ```

      ```
      [[1 2 3]
       [4 5 6]]
      ```

      This matrix has 2 rows and 3 columns. Python describes that size as `(2, 3)`: **rows first, then columns**. You'll use that in the next exercise.

