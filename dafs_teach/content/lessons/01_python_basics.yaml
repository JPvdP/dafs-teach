title: Python Basics
description: Your very first steps in Python — importing packages, creating and overwriting variables, text/number/boolean values, lists, NumPy arrays and matrices, dictionaries, and reading error messages.

exercises:

  - id: import_packages
    title: "Importing Packages"
    instructions: |
      Python comes with a set of basic, built-in **functions** — like `print()`, `len()`, and `max()`. A function is a ready-made tool that does one specific job. Think of Python as a basic toolbox with some essential tools available right away.

      However, sometimes you need more specialized tools. Other people have written many extra functions for specific purposes, and they share them in **packages**. A package is like an extra toolbox full of new functions that someone else has created for a specific purpose.

      The three packages you'll use most in this course:

      - **`pandas`** — for data in **tables** (like Excel). Each column in a table can hold a different kind of data: text, numbers, dates, or `True`/`False`. Most of your data analysis will happen in pandas.
      - **`numpy`** — for **arrays and matrices**: grids of values that are all of the same type, which in practice means **numbers**. Because everything is a number, numpy can do math on large amounts of data very quickly. (pandas is actually built on top of numpy.)
      - **`matplotlib`** — for making **graphs**.

      Packages only need to be **installed once** (more on that in a later lesson). After that, you **import** them each time you start working:

      ```python
      import pandas as pd
      ```

      It is common practice to give packages a short nickname. For `pandas` we use `pd`, for `numpy` we use `np`, and for `matplotlib.pyplot` we use `plt`. This way, instead of writing `pandas.DataFrame()`, you can write `pd.DataFrame()`. You'll see exactly how that works when we use numpy later in this lesson.

      **Your task:**
      Import the three core data analysis packages with their standard short names:
      - `numpy` as `np`
      - `pandas` as `pd`
      - `matplotlib.pyplot` as `plt`

      Then print `"Packages loaded!"`.
    starter_code: |
      # Import the three packages here


      print("Packages loaded!")
    tests:
      - type: output_equals
        value: "Packages loaded!"
      - type: assert
        code: |
          import sys
          assert 'numpy' in sys.modules, 'numpy was not imported. Use: import numpy as np'
          assert 'pandas' in sys.modules, 'pandas was not imported. Use: import pandas as pd'
          assert 'matplotlib.pyplot' in sys.modules, 'matplotlib.pyplot was not imported. Use: import matplotlib.pyplot as plt'
        description: "numpy, pandas and matplotlib.pyplot must all be imported"
    hints:
      - "import numpy as np"
      - "import pandas as pd"
      - "import matplotlib.pyplot as plt"
    solution: |
      import numpy as np
      import pandas as pd
      import matplotlib.pyplot as plt

      print("Packages loaded!")

  - id: create_a_variable
    title: "Creating Variables"
    instructions: |
      A **variable** is like a labeled storage box: you put a value inside it, and give it a name so you can find and reuse it later.

      In Python, you create a variable by writing a name, an `=` sign, and the value you want to store:

      ```python
      score = 10
      ```

      Why do we create variables?

      - **Convenience:** Instead of typing the same value repeatedly, you store it once and use its name.
      - **Flexibility:** If the value changes, you only update it in one place.
      - **Reusability:** Once stored, a value can be reused as many times as you want, which makes your code cleaner.

      ```python
      # Without variables
      print(20 + 30)

      # With variables
      a = 20
      b = 30
      result = a + b
      print(result)
      ```

      A few rules for variable names:
      - Names can contain letters, numbers, and underscores (`_`)
      - Names cannot start with a number
      - Names cannot contain spaces — use `student_name`, not `student name`
      - Names are case-sensitive: `score` and `Score` are different variables

      **Showing a value with `print()`**

      Creating a variable doesn't show anything on the screen — Python just stores the value quietly. To actually *see* a value, you use the `print()` function: write `print`, then put the thing you want to see between the parentheses `( )`.

      This code:

      ```python
      city = "Utrecht"
      population = 360000
      print(city)
      print(population)
      ```

      produces this output when you click **▶ Run**:

      ```
      Utrecht
      360000
      ```

      Notice that `print(city)` shows the *value* stored in `city` (`Utrecht`), not the word "city". Each `print()` puts its result on a new line.

      **Doing math**

      You can use Python as a calculator, with these operators:

      | Operator | Meaning | Example | Result |
      |----------|---------|---------|--------|
      | `+` | addition | `5 + 2` | `7` |
      | `-` | subtraction | `5 - 2` | `3` |
      | `*` | multiplication | `5 * 2` | `10` |
      | `/` | division | `5 / 2` | `2.5` |
      | `**` | power | `5 ** 2` | `25` |

      Python follows the normal order of operations (multiplication and division before addition and subtraction), and you can use parentheses `()` to control the order.

      **Your task:**
      1. Create a variable `a` with the value `45`
      2. Create a variable `b` with the value `18`
      3. Create `result` equal to `a + b`, `difference` equal to `a - b`, and `ratio` equal to `a / b`
      4. Print `result`, `difference` and `ratio`, one per line
    starter_code: |
      # Create your variables here
      a =
      b =

      result =
      difference =
      ratio =

      print(result)
      print(difference)
      print(ratio)
    tests:
      - type: output_equals
        value: "63\n27\n2.5"
      - type: assert
        code: |
          assert a == 45, 'a should be 45'
          assert b == 18, 'b should be 18'
          assert result == 63, 'result should be a + b'
          assert difference == 27, 'difference should be a - b'
          assert ratio == 2.5, 'ratio should be a / b'
        description: "a=45, b=18, and result, difference and ratio calculated from them"
    hints:
      - "a = 45 stores the value 45 in the variable a"
      - "result = a + b adds a and b together"
      - "Use - for subtraction and / for division"
    solution: |
