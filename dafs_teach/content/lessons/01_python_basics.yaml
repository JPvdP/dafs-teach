          assert isinstance(temps_c, _np.ndarray), 'temps_c should be a NumPy array — create it with np.array([...])'
          assert _np.allclose(temps_c, [12.0, 15.5, 9.0, 20.0]), 'temps_c should contain 12.0, 15.5, 9.0 and 20.0'
          assert _np.allclose(temps_f, [53.6, 59.9, 48.2, 68.0]), 'temps_f should be temps_c * 1.8 + 32'
