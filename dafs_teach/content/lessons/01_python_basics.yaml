title: Python Basics
description: Your very first steps in Python — creating variables, the difference between text/number/boolean values, the print() function, and basic math.

exercises:

  - id: create_a_variable
    title: "Creating Your First Variable"
    instructions: |
      Think of a **variable** as a labeled box: you put a value inside it, and give it a name so you can find and reuse it later.

      In Python, you create a variable by writing a name, an `=` sign, and the value you want to store:

      ```python
      score = 10
      ```

      Here we created a variable called `score` and stored the value `10` in it. From now on, wherever you write `score`, Python uses `10`.

      A few rules for variable names:
      - Names can contain letters, numbers, and underscores (`_`)
      - Names cannot start with a number
      - Names cannot contain spaces — use `student_name`, not `student name`
      - Names are case-sensitive: `score` and `Score` are different variables

      To display a variable's value on the screen, use Python's built-in `print()` function with the variable name between the parentheses:

      ```python
      print(score)   # displays: 10
      ```

      We'll explain `print()` properly in a couple of exercises — for now, just know that writing `print(variable_name)` shows its value.

      **Your task:**
      1. Create a variable called `student_name` and set it to the text `"Sam"`
      2. Create a variable called `student_age` and set it to the number `21`
      3. Print `student_name`
      4. Print `student_age`
    starter_code: |
      # Create your variables below


      # Now print them


    tests:
      - type: output_contains
        value: "Sam"
      - type: output_contains
        value: "21"
      - type: assert
        code: "assert student_name == 'Sam', 'student_name should be the text Sam'"
        description: "`student_name` should equal \"Sam\""
      - type: assert
        code: "assert student_age == 21, 'student_age should be the number 21'"
        description: "`student_age` should equal 21"
    hints:
      - "A variable is created with: name = value"
      - "Text needs quotes: student_name = \"Sam\""
      - "Numbers don't need quotes: student_age = 21"
      - "print(student_name) displays the value stored in student_name"
    solution: |
      student_name = "Sam"
      student_age = 21
      print(student_name)
      print(student_age)

  - id: text_number_boolean
    title: "Text, Numbers, and Booleans"
    instructions: |
      Not all values are the same kind of thing. Python calls the "kind" of a value its **type**. The three types you'll use constantly are:

      | Type | What it is | How you write it | Example |
      |------|-----------|-------------------|---------|
      | text (`str`) | A piece of text | Between quotes `"..."` | `"hello"` |
      | number (`int`/`float`) | A whole or decimal number | Just the digits, no quotes | `42` or `3.14` |
      | boolean (`bool`) | True or False | Exactly `True` or `False` — capital letter, no quotes | `True` |

      The quotes matter a lot: `5` is a number you can do math with, but `"5"` is text — Python treats it completely differently (more on that in a later lesson).

      Booleans represent yes/no or on/off situations — for example "is the course open for enrollment? `True`".

      **Your task:**
      1. Create a variable `course` set to the text `"Data Analysis"`
      2. Create a variable `n_students` set to the number `25`
      3. Create a variable `is_open` set to `True`
      4. Print all three variables, one per line (use `print()`, like in the previous exercise)
    starter_code: |
      # Create the three variables


      # Print all three, one per line

    tests:
      - type: output_contains
        value: "Data Analysis"
      - type: output_contains
        value: "25"
      - type: output_contains
        value: "True"
      - type: assert
        code: |
          assert course == 'Data Analysis', 'course should be the text "Data Analysis"'
          assert n_students == 25, 'n_students should be the number 25'
          assert is_open == True, 'is_open should be True'
        description: "course=\"Data Analysis\", n_students=25, is_open=True"
    hints:
      - "Text always needs quotes: course = \"Data Analysis\""
      - "Numbers never need quotes: n_students = 25"
      - "True starts with a capital T and needs no quotes: is_open = True"
      - "print(course), then print(n_students), then print(is_open) — one per line"
    solution: |
      course = "Data Analysis"
      n_students = 25
      is_open = True

      print(course)
      print(n_students)
      print(is_open)

  - id: using_print
    title: "The print() Function"
    instructions: |
      `print()` is a **function** — ready-made code that does something when you call it. `print()` displays whatever you put between the parentheses on the screen.

      ```python
      print("Hello!")   # displays: Hello!
      print(42)         # displays: 42
      ```

      You can print more than one thing at once by separating the values with a comma. Python automatically puts a space between them:

      ```python
      name = "Sam"
      age = 21
      print("Name:", name, "Age:", age)
      # displays: Name: Sam Age: 21
      ```

      Every call to `print()` starts a new line in the output — this is how we'll ask you to show results throughout the rest of this course.

      **Your task:**
      Using the variables `subject = "Python"` and `grade = 8` (already created for you):
      1. Print the text `"Subject:"` together with the variable `subject`, on one line
      2. Print the text `"Grade:"` together with the variable `grade`, on one line
    starter_code: |
      subject = "Python"
      grade = 8

      # Print "Subject:" and the subject variable together


      # Print "Grade:" and the grade variable together

    tests:
      - type: output_equals
        value: "Subject: Python\nGrade: 8"
    hints:
      - "Separate each thing you want to print with a comma"
      - "print(\"Subject:\", subject)"
      - "print(\"Grade:\", grade)"
    solution: |
      subject = "Python"
      grade = 8

      print("Subject:", subject)
      print("Grade:", grade)

  - id: basic_math_operations
    title: "Basic Mathematical Operations"
    instructions: |
      Python can be used as a calculator. The main mathematical operators are:

      | Operator | Meaning | Example | Result |
      |----------|---------|---------|--------|
      | `+` | addition | `5 + 2` | `7` |
      | `-` | subtraction | `5 - 2` | `3` |
      | `*` | multiplication | `5 * 2` | `10` |
      | `/` | division | `5 / 2` | `2.5` |
      | `**` | power | `5 ** 2` | `25` |

      Just like in regular math, Python follows the standard order of operations (multiplication/division before addition/subtraction), and you can use parentheses `()` to control the order.

      ```python
      x = 4
      y = 3
      total = x + y
      print(total)   # 7
      ```

