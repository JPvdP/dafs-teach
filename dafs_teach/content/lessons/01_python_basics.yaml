  - id: overwriting_variables
    title: "Overwriting Variables"
    instructions: |
      A variable holds **one** value at a time. If you assign a new value to a name that already exists, the old value is **replaced** — it's gone, and Python doesn't keep a copy.

      ```python
      plop = 10
      print(plop)   # 10

      plop = 20
      print(plop)   # 20 — the 10 has been overwritten
      ```

      You can also use a variable's current value to calculate its new value:

      ```python
      plop = plop + 5
      print(plop)   # 25
      ```

      Python first works out the right-hand side (`20 + 5`), and then stores the result back in `plop`.

      **Why this matters for data:** later in the course you'll write things like `df = df[df["year"] > 2000]` — keeping only some rows of a dataset and storing the result under the *same* name. That's convenient, but the original data is now gone from that variable. If you make a mistake (filter the wrong rows, or run the same line twice), you can't simply "undo" it: you have to **go back and re-run your code from the beginning**, starting from loading the data.

      This is especially tricky in Jupyter notebooks, where you can run cells one at a time and in any order. Running `plop = plop + 5` twice adds 5 twice! In this app, every click on **▶ Run** starts fresh from the top, so you won't have that problem here — but keep it in mind for later.

      **Your task:**
      You're tracking a factory's yearly CO₂ emissions (in tonnes).
      1. Create `emissions` set to `120` and print it
      2. The measurement was wrong — overwrite `emissions` with `95` and print it
      3. A new filter reduces emissions by 15: set `emissions` to `emissions - 15` and print it
    starter_code: |
      # 1. Create emissions and print it


      # 2. Overwrite emissions with 95 and print it


      # 3. Reduce emissions by 15 and print it

    tests:
      - type: output_equals
        value: "120\n95\n80"
      - type: assert
        code: "assert emissions == 80, f'emissions should end at 80, got {emissions}'"
        description: "`emissions` should end at 80"
    hints:
      - "Start with emissions = 120, then print(emissions)"
      - "Overwrite it by assigning again: emissions = 95"
      - "emissions = emissions - 15 uses the current value (95) to calculate the new one"
    solution: |
      emissions = 120
      print(emissions)

      emissions = 95
      print(emissions)

      emissions = emissions - 15
      print(emissions)

  - id: lists_in_practice
    title: "Lists: Many Values in One Variable"
    instructions: |
      So far each variable held a single value. But data almost always comes in **many** values: a temperature for every day, an energy reading for every hour, a name for every country. Creating a separate variable for each (`day1`, `day2`, `day3`, …) would be hopeless.

      A **list** stores many values, in order, under one name. You write it with square brackets `[ ]` and separate the values with commas:

      ```python
      cities = ["Utrecht", "Amsterdam", "Rotterdam"]
      ```

      **Where you'll use lists in practice:**
      - **A column of data** — the daily rainfall measurements from a weather station are naturally a list of numbers. In the next lesson you'll see that a pandas table is built from lists like these.
      - **A selection** — e.g. the list of countries you want to include in your analysis: `["Netherlands", "Germany", "Belgium"]`
      - **Repeating work** — later you'll *loop* over a list to do the same calculation for every item (every year, every file, every country).

      A few things you can do with a list:

      ```python
      rainfall_mm = [4.2, 0.0, 11.5, 3.1]

      rainfall_mm[0]     # 4.2  — the first item (Python counts from 0!)
      len(rainfall_mm)   # 4    — how many items there are
      sum(rainfall_mm)   # 18.8 — all items added up
      ```

