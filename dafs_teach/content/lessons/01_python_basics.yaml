  - id: numbers_vs_text_math
    title: "Numbers vs. Text That Looks Like a Number"
    instructions: |
      Earlier you saw that `5` and `"5"` are different things. Let's see what that means in practice, because it **will** happen to you when working with data.

      Take these two variables:

      ```python
      a = 30      # a number
      b = "42"    # text — it only *looks* like a number
      ```

      Now watch what the same operators do to each of them:

      | Code | Result | Why |
      |------|--------|-----|
      | `a * 2` | `60` | Number × 2 is normal math |
      | `b * 2` | `"4242"` | Text × 2 means "repeat the text twice" |
      | `b + b` | `"4242"` | `+` on text glues the pieces together |
      | `a + b` | **`TypeError`** | Python refuses to add a number to text |

      So `"42" * 2` doesn't give you `84` — it gives you `4242`, and Python won't warn you about it. That's what makes this mistake dangerous: your code runs, but the answer is wrong.

      **Why this matters for data:** when you load a spreadsheet or CSV file, a column of numbers is sometimes read in as text (for example because one cell contains `"n/a"` or a stray space). Calculations on that column then give strange results or errors.

      The fix is to **convert** the text to a number first, using `int()` (for whole numbers) or `float()` (for decimals):

      ```python
      int(b)        # 42 — now a real number
      a + int(b)    # 72
      ```

      **Your task:**
      1. Create a variable `a` set to the number `30`
      2. Create a variable `b` set to the text `"42"`
      3. Create `double_a` equal to `a * 2`, and `double_b` equal to `b * 2`
      4. Create `total` equal to `a` plus `b` converted to a number with `int()`
      5. Print `double_a`, `double_b` and `total`, one per line

      Before you click Run, try to predict what each line will print!
    starter_code: |
      # 1-2. Create a (a number) and b (text)


      # 3. Multiply both by 2
      double_a =
      double_b =

      # 4. Add a and b, after converting b to a number
      total =

      print(double_a)
      print(double_b)
      print(total)
    tests:
      - type: output_equals
        value: "60\n4242\n72"
      - type: assert
        code: |
          assert a == 30, 'a should be the number 30 (no quotes)'
          assert b == '42', 'b should be the text "42" (with quotes)'
          assert total == 72, 'total should be a + int(b) = 72'
        description: "a=30, b=\"42\", total=72"
    hints:
      - "a = 30 has no quotes; b = \"42\" has quotes"
      - "double_a = a * 2 and double_b = b * 2"
      - "a + b gives a TypeError — convert b first with int(b)"
      - "total = a + int(b)"
    solution: |
      a = 30
      b = "42"

      double_a = a * 2
      double_b = b * 2

      total = a + int(b)

      print(double_a)
      print(double_b)
