      import pandas as pd

      data = {
          "Name":   ["Alice", "Bob", "Charlie", "David", "Eve"],
          "Age":    [25, 30, 22, 28, 24],
          "Gender": ["Female", "Male", "Male", "Male", "Female"],
      }
      df = pd.DataFrame(data)

      # Select Name and Age by column name
      selected =

      print(selected)

      # Select first two columns by index (all rows)
      by_index =

      print(by_index)
    tests:
      - type: output_contains
        value: "Alice"
      - type: output_contains
        value: "25"
      - type: assert
        code: |
          assert list(selected.columns) == ["Name", "Age"], f"Got {list(selected.columns)}"
          assert list(by_index.columns) == ["Name", "Age"], f"Got {list(by_index.columns)}"
          assert selected.shape == (5, 2)
        description: "selected and by_index should both have columns Name and Age"
    hints:
      - "selected = df[[\"Name\", \"Age\"]]"
      - "by_index = df.iloc[:, [0, 1]]  — the : means all rows"
    solution: |
      import pandas as pd

      data = {
          "Name":   ["Alice", "Bob", "Charlie", "David", "Eve"],
          "Age":    [25, 30, 22, 28, 24],
          "Gender": ["Female", "Male", "Male", "Male", "Female"],
      }
      df = pd.DataFrame(data)

      selected = df[["Name", "Age"]]
      print(selected)

      by_index = df.iloc[:, [0, 1]]
      print(by_index)

