title: DataFrame Operations
description: Learn to select columns, filter rows, add computed columns, merge datasets, and summarise data with groupby — the core skills of data analysis in Python.

exercises:

  - id: select_columns
    title: Selecting Columns
    instructions: |
      Just as in R, Python allows for the extraction of columns both by their name and by their index.

      To select columns **by name**, use double brackets `[[]]` with a list of column names:

      ```python
      # Single column (returns a DataFrame, not a Series)
      selected = df[["Name"]]

      # Multiple columns
      selected = df[["Name", "Age"]]
      ```

      To select by **index**, use `.iloc`. The first argument is rows, the second is columns. Use `:` to mean "all rows":

      ```python
      # All rows, columns at index 0 and 1
      selected = df.iloc[:, [0, 1]]

      # Specific rows (no column specified → selects rows by index)
      filtered = df.iloc[[0, 4]]
      ```

      **Your task:**
      Using the DataFrame below:
      1. Select only the `Name` and `Age` columns by name, store in `selected`
      2. Print `selected`
      3. Select all rows of the first two columns using `.iloc`, store in `by_index`
      4. Print `by_index`
