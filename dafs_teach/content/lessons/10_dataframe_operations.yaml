      print(df_sorted)

      # Top 3 countries
      top3 =
      print(top3)

      # Country with the highest renewable percentage
      best_country = top3.iloc[0]["country"]
      print("Best:", best_country)
    tests:
      - type: output_contains
        value: "Best: NO"
      - type: assert
        code: |
          assert df_sorted.iloc[0]["country"] == "NO", "First sorted row should be NO (98%)"
          assert list(top3["country"]) == ["NO", "SE", "DE"], f"Top 3 should be NO, SE, DE — got {list(top3['country'])}"
          assert best_country == "NO"
