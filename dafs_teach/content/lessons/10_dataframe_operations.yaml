      Using the country energy DataFrame below:
      1. Sort by `"renewable_pct"` descending — store as `df_sorted` and print it
      2. Select the top 3 countries — store as `top3` and print it
      3. Print the name of the country with the highest percentage using `top3.iloc[0]["country"]`
