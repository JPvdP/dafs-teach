  - id: filter_multiple
    title: Filtering with Multiple Conditions
    instructions: |
      When filtering DataFrames with multiple conditions, the standard Python operators `and`, `or`, `not` do **not** work. Instead, pandas uses:

      | Operation | Pandas operator |
      |-----------|----------------|
      | and | `&` |
      | or | `\|` |
      | not | `~` |

      Each condition must be **wrapped in parentheses**:

      ```python
      # Patents in domain B60C with year >= 2019
      subset = df[(df["Year"] >= 2019) & (df["Domain"] == "B60C")]

      # Patents NOT in domain B60C
      subset = df[~(df["Domain"] == "B60C")]
      ```

