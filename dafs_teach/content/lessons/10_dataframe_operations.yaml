      - "df_sorted.head(3) gives the top 3 rows"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "country":       ["NL", "DE", "FR", "ES", "PL", "SE", "NO"],
          "renewable_pct": [15,   40,   20,   35,    8,   65,   98],
          "total_gw":      [20,  100,   80,   60,   50,   30,   15],
      })

      df_sorted = df.sort_values(by="renewable_pct", ascending=False)
      print(df_sorted)

      top3 = df_sorted.head(3)
      print(top3)

      best_country = top3.iloc[0]["country"]
      print("Best:", best_country)

  - id: string_operations
    title: "String Operations on Columns"
    instructions: |
      Pandas string columns have a `.str` accessor that applies string methods to every value at once:

      ```python
      df["city"].str.upper()        # uppercase every name
      df["city"].str.len()          # length of each string
      df["city"].str.contains("a")  # True/False for each row
      ```

