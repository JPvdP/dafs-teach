      To filter rows in a pandas DataFrame, you use **boolean indexing**: you write a condition inside `[]` that produces `True`/`False` for each row, and only the `True` rows are kept.

      ```python
      # Keep only rows where Year == 2023
      subset = df[df["Year"] == 2023]
