  - id: add_column
    title: Adding a Computed Column
    instructions: |
      In a DataFrame, we refer to columns by their name inside brackets `[]`. We can use the same notation to **create a new column** — just assign a value to a column name that does not yet exist:

      ```python
      Data["new_column"] = Data["Fuel_consumption"] / Data["Population"]
      ```

      This creates a new column `"new_column"` where each value is `Fuel_consumption` divided by `Population`. By default, pandas applies this **row by row** — so each country gets its own GDP per capita.

      **Your task:**
      Using the DataFrame below (GDP in billions, population in millions):
      1. Add a column `"gdp_per_capita"` = `gdp / population`
      2. Print the full DataFrame
      3. Print the mean of `gdp_per_capita` rounded to 2 decimal places
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          "country":    ["NL", "DE", "FR"],
          "population": [17, 84, 68],
          "gdp":        [1000, 4200, 2800],
      })

      # Add gdp_per_capita column
      df["gdp_per_capita"] =

      print(df)
      print(round(df["gdp_per_capita"].mean(), 2))
    tests:
      - type: output_contains
        value: "gdp_per_capita"
      - type: assert
        code: |
          assert "gdp_per_capita" in df.columns
          assert abs(df.loc[0, "gdp_per_capita"] - 1000/17) < 0.01, "NL gdp_per_capita wrong"
          assert abs(df.loc[1, "gdp_per_capita"] - 4200/84) < 0.01, "DE gdp_per_capita wrong"
          assert abs(df.loc[2, "gdp_per_capita"] - 2800/68) < 0.01, "FR gdp_per_capita wrong"
        description: "gdp_per_capita = gdp / population for each row"
    hints:
      - "df[\"gdp_per_capita\"] = df[\"gdp\"] / df[\"population\"]"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "country":    ["NL", "DE", "FR"],
          "population": [17, 84, 68],
          "gdp":        [1000, 4200, 2800],
      })

      df["gdp_per_capita"] = df["gdp"] / df["population"]

      print(df)
      print(round(df["gdp_per_capita"].mean(), 2))

  - id: groupby_agg
    title: Grouping and Summarising
    instructions: |
      With real data we often need to regroup observations — by year, organisation, region, or any other entity. For example: if we have a database with patents and we want to know the earliest and latest patent per domain, we need to group by domain and compute `min` and `max` on the year.

      In Python we do this with `groupby` and `agg`:

      ```python
      grouped = df.groupby("Domain")["Year"].agg(["min", "max"]).reset_index()
      ```

      - `groupby("Domain")` — creates a group for each unique domain
      - `["Year"]` — tells pandas to work on the Year column
      - `.agg(["min", "max"])` — computes min and max within each group
      - `.reset_index()` — turns the group labels back into a regular column

      To simply count observations per group, use `.count()`:

      ```python
      counts = df.groupby("Domain").count().reset_index()
      ```

      **Your task:**
      Using the patents DataFrame:
      1. Create `year_range` — groupby Domain, get min and max Year. Print it.
      2. Create `counts` — groupby Domain, count all columns. Print it.
