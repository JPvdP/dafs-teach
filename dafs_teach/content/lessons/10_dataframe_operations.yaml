          "Year":    [2002, 2023, 2023, 2019, 2019],
          "Domain":  ["B60C", "B60C", "B29D", "C08K", "C08K"],
      }
      df = pd.DataFrame(data)

      # Min and max year per domain
      year_range =
      print(year_range)

      # Count per domain
      counts =
      print(counts)
    tests:
      - type: output_contains
        value: "B60C"
      - type: output_contains
        value: "2002"
      - type: assert
        code: |
          assert year_range.shape == (3, 3), f"year_range should have 3 rows and 3 cols, got {year_range.shape}"
          b60c_row = year_range[year_range["Domain"] == "B60C"]
          assert b60c_row["min"].values[0] == 2002
          assert b60c_row["max"].values[0] == 2023
        description: "year_range should have 3 domains, B60C min=2002 max=2023"
    hints:
      - "year_range = df.groupby(\"Domain\")[\"Year\"].agg([\"min\", \"max\"]).reset_index()"
      - "counts = df.groupby(\"Domain\").count().reset_index()"
    solution: |
      import pandas as pd

      data = {
          "Pat_num": ["WO200214562", "WO2023738962", "EP2023778962", "FR2019272698", "FR201922671"],
          "Year":    [2002, 2023, 2023, 2019, 2019],
          "Domain":  ["B60C", "B60C", "B29D", "C08K", "C08K"],
      }
      df = pd.DataFrame(data)

      year_range = df.groupby("Domain")["Year"].agg(["min", "max"]).reset_index()
      print(year_range)

      counts = df.groupby("Domain").count().reset_index()
      print(counts)

  - id: merge_dataframes
    title: Merging DataFrames
    instructions: |
      When working with data we often need to merge information from different data sources. For example, we want to analyse the link between population density and air pollution. We find pollution data from the WHO, but population data comes from a different source — we end up with two datasets.

      | Country | Pollution |    | Country | Population |
      |---------|-----------|    |---------|------------|
      | NL      | 21        |    | NL      | 17M        |
      | DE      | 23        |    | DE      | 84M        |
      | FR      | 17        |    | FR      | 68M        |

      We combine them with `pd.merge()`, matching rows by a **key** column:

      ```python
      merged = pd.merge(df_1, df_2, on="Country")
      ```

      There are multiple ways to merge — the `how` argument controls which rows to keep:

      ```python
      pd.merge(df_1, df_2, on="Country", how="inner")   # only matching rows (default)
      pd.merge(df_1, df_2, on="Country", how="left")    # all rows from df_1
      pd.merge(df_1, df_2, on="Country", how="outer")   # all rows from both
      ```

      **Your task:**
      1. Merge `df_pollution` and `df_population` on `"Country"` (inner join) into `merged`
      2. Print `merged`
      3. Add a computed column `"pollution_per_capita"` = `pollution / population`
      4. Print the country with the **highest** pollution per capita
    starter_code: |
      import pandas as pd

      df_pollution = pd.DataFrame({
          "Country":   ["NL", "DE", "FR"],
          "pollution": [21, 23, 17],
      })
      df_population = pd.DataFrame({
          "Country":    ["NL", "DE", "FR"],
          "population": [17, 84, 68],
      })

      # Merge on Country
      merged =

      print(merged)

      # Add pollution_per_capita
      merged["pollution_per_capita"] =

      # Print the country with the highest value
      best = merged.loc[merged["pollution_per_capita"].idxmax(), "Country"]
      print(best)
    tests:
      - type: output_contains
        value: "NL"
      - type: assert
        code: |
          assert "pollution_per_capita" in merged.columns, "pollution_per_capita column missing"
          assert len(merged) == 3, f"merged should have 3 rows, got {len(merged)}"
          assert "Country" in merged.columns and "pollution" in merged.columns and "population" in merged.columns
          assert abs(merged.loc[merged["Country"] == "NL", "pollution_per_capita"].values[0] - 21/17) < 0.001
        description: "merged should have 3 rows; NL has highest pollution per capita (21/17)"
    hints:
      - "merged = pd.merge(df_pollution, df_population, on=\"Country\")"
      - "merged[\"pollution_per_capita\"] = merged[\"pollution\"] / merged[\"population\"]"
      - "NL: 21/17 ≈ 1.24 is the highest"
    solution: |
      import pandas as pd

      df_pollution = pd.DataFrame({
          "Country":   ["NL", "DE", "FR"],
          "pollution": [21, 23, 17],
      })
      df_population = pd.DataFrame({
          "Country":    ["NL", "DE", "FR"],
          "population": [17, 84, 68],
      })

      merged = pd.merge(df_pollution, df_population, on="Country")
      print(merged)

      merged["pollution_per_capita"] = merged["pollution"] / merged["population"]
      best = merged.loc[merged["pollution_per_capita"].idxmax(), "Country"]
      print(best)

  - id: sort_and_rank
    title: "Sorting and Top-N Selection"
    instructions: |
      Sorting a DataFrame is done with `.sort_values(by="column_name")`. By default it sorts ascending; add `ascending=False` for descending order:

      ```python
      df.sort_values(by="score", ascending=False)
      ```

      Chain `.head(N)` to keep only the top N rows after sorting:

      ```python
      top3 = df.sort_values(by="score", ascending=False).head(3)
      ```

