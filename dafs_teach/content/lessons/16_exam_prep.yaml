      ]

      for student in students:
          avg_score = (student["Math"] + student["Science"] + student["English"]) / 3
          if avg_score >= 60:
              student["Passed"] = True
          else:
              student["Passed"] = False

          # Add grade_letter based on avg_score
          if avg_score >= 80:
              student["grade_letter"] =
          elif avg_score >= 70:
              # grade B
          elif avg_score >= 60:
              # grade C
          else:
              # grade F

      for student in students:
          print(student)
    tests:
      - type: output_contains
        value: "'Passed': True"
      - type: output_contains
        value: "'Passed': False"
      - type: output_contains
        value: "'grade_letter': 'B'"
      - type: output_contains
        value: "'grade_letter': 'F'"
      - type: assert
        code: |
          alice = next(s for s in students if s["name"] == "Alice")
          bob   = next(s for s in students if s["name"] == "Bob")
          charlie = next(s for s in students if s["name"] == "Charlie")
          assert alice["grade_letter"] == "B",   f"Alice avg=70, expected B, got {alice.get('grade_letter')}"
          assert bob["grade_letter"] == "F",     f"Bob avg=40, expected F, got {bob.get('grade_letter')}"
          assert charlie["grade_letter"] == "C", f"Charlie avg=65, expected C, got {charlie.get('grade_letter')}"
        description: "Alice=B (avg 70), Bob=F (avg 40), Charlie=C (avg 65)"
    hints:
      - "student[\"grade_letter\"] = \"B\" inside the elif avg_score >= 70 block"
      - "Check the thresholds in order: 80 first, then 70, then 60, then else"
    solution: |
      students = [
          {"name": "Alice",   "Math": 70, "Science": 80, "English": 60},
          {"name": "Bob",     "Math": 40, "Science": 50, "English": 30},
          {"name": "Charlie", "Math": 65, "Science": 75, "English": 55},
      ]

      for student in students:
          avg_score = (student["Math"] + student["Science"] + student["English"]) / 3
          if avg_score >= 60:
              student["Passed"] = True
          else:
              student["Passed"] = False

          if avg_score >= 80:
              student["grade_letter"] = "A"
          elif avg_score >= 70:
              student["grade_letter"] = "B"
          elif avg_score >= 60:
              student["grade_letter"] = "C"
          else:
              student["grade_letter"] = "F"

      for student in students:
          print(student)

  - id: login_function
    title: "Writing Code — Login System"
    instructions: |
      The final exam question type asks you to **write a short script** from scratch.

      **Task (from the exam):**

      > You are in charge of a log-in system on a website. When the correct password is provided, print `"Success!"`. If the user has failed 3 times, stop the system and print `"Game Over!"`. Write a function that can perform this task.

      Because our app cannot use `input()` (which waits for the user to type), write the function to accept a **list of password attempts** and a **correct password** as arguments. This is actually better practice: it makes the function testable.

      ```python
      def login_system(attempts, correct_password):
          # your code here

      # Test cases
      login_system(["wrong", "test", "secret"], "secret")   # succeeds on 3rd try
      login_system(["x", "y", "z"], "secret")               # fails all 3
      ```

      Expected output:
      ```
      Wrong password!
      Wrong password!
      Success!
      Wrong password!
      Wrong password!
      Game Over!
      ```
    starter_code: |
      def login_system(attempts, correct_password):
          for i, attempt in enumerate(attempts):
              if attempt == correct_password:
                  # print success and stop

              if i >= 2:
                  # 3rd attempt failed — print game over and stop

              # wrong but not yet 3 failures


      # Test your function
      login_system(["wrong", "test", "secret"], "secret")
      print("---")
      login_system(["x", "y", "z"], "secret")
    tests:
      - type: output_contains
        value: "Success!"
      - type: output_contains
        value: "Game Over!"
      - type: assert
        code: |
          import io, sys

          def capture(func, *args):
              buf = io.StringIO()
              sys.stdout, old = buf, sys.stdout
              func(*args)
              sys.stdout = old
              return buf.getvalue()

          out1 = capture(login_system, ["secret"], "secret")
          assert "Success!" in out1, "Correct password on 1st try should print Success!"
          assert "Game Over!" not in out1

          out2 = capture(login_system, ["a", "b", "c"], "secret")
          assert "Game Over!" in out2, "3 wrong guesses should print Game Over!"
          assert "Success!" not in out2

          out3 = capture(login_system, ["a", "secret", "c"], "secret")
          assert "Success!" in out3, "Correct on 2nd try should print Success!"
          assert "Game Over!" not in out3
        description: "Must print Success! for correct password, Game Over! after 3 wrong attempts"
    hints:
      - "print(\"Success!\") then return — inside the if attempt == correct_password block"
      - "print(\"Game Over!\") then return — inside the if i >= 2 block"
      - "print(\"Wrong password!\") at the end of the loop body (no return)"
    solution: |
      def login_system(attempts, correct_password):
          for i, attempt in enumerate(attempts):
              if attempt == correct_password:
                  print("Success!")
                  return
              if i >= 2:
                  print("Game Over!")
                  return
              print("Wrong password!")

      login_system(["wrong", "test", "secret"], "secret")
      print("---")
      login_system(["x", "y", "z"], "secret")

  - id: debug_the_script
    title: "Finding Errors — Debug the Script"
    instructions: |
      A key exam skill is **identifying and fixing bugs in existing code**. Read the script below carefully and find the two errors:

      ```python
      scores = [72, 88, 55, 91, 63, 77]

      total = 0
      for score in scores:
          total = score          # BUG 1

      average = total / len(scores)

      highest = scores[0]
      for score in scores:
          if score < highest:    # BUG 2
              highest = score

      print(f"Average: {average:.1f}")
      print(f"Highest: {highest}")
      ```

      **Bug 1:** `total = score` replaces the running total on every iteration instead of adding to it.
      **Bug 2:** `if score < highest` finds the *minimum*, not the maximum.

      **Your task:**
      Fix both bugs. Expected output:
      ```
      Average: 74.3
      Highest: 91
      ```
    starter_code: |
      scores = [72, 88, 55, 91, 63, 77]

      total = 0
      for score in scores:
          total = score          # fix this line

      average = total / len(scores)

      highest = scores[0]
      for score in scores:
          if score < highest:    # fix this condition
              highest = score

      print(f"Average: {average:.1f}")
      print(f"Highest: {highest}")
    tests:
      - type: output_contains
        value: "Average: 74.3"
      - type: output_contains
        value: "Highest: 91"
      - type: assert
        code: |
          assert abs(average - 446/6) < 0.001, f"average should be ~74.3, got {average}"
          assert highest == 91, f"highest should be 91, got {highest}"
        description: "Average = 446/6 ≈ 74.3, Highest = 91"
    hints:
      - "total += score — use += to accumulate, not = which overwrites"
      - "if score > highest — change < to > to find the maximum"
    solution: |
      scores = [72, 88, 55, 91, 63, 77]

      total = 0
      for score in scores:
          total += score

      average = total / len(scores)

      highest = scores[0]
      for score in scores:
          if score > highest:
              highest = score

      print(f"Average: {average:.1f}")
      print(f"Highest: {highest}")

  - id: unfamiliar_function
    title: "Using an Unfamiliar Function — Handling Missing Data"
    instructions: |
      In the exam — and in real datasets — you will sometimes need to use a function you haven't seen before. The skill being tested isn't memorisation, it's reading a short explanation of what a function does and correctly slotting it into existing code: the right import, the right call, the right arguments, in the right place.

      Real-world data almost always has **missing values** — a sensor that failed, a field nobody filled in. In pandas, missing values show up as `NaN`, and here is the function you'll need to deal with them, explained the way you'd find it in documentation:

      **`DataFrame.dropna(subset=None)`**
      - **Package:** `pandas` (already imported as `pd` below)
      - **What it does:** returns a **new** DataFrame with any row that has a missing value **removed**. It does not change the original DataFrame.
      - **Argument `subset`** *(optional)*: a list of column names. If given, only rows with a missing value in **those** columns are dropped — missing values in other columns are ignored. If omitted, a row is dropped if **any** column is missing a value.

      ```python
      clean_df = df.dropna(subset=["pollution"])
      ```

      This keeps every row whose `pollution` value is present, regardless of what's missing elsewhere.

      **Your task:**
      The script below measures air pollution in several cities; some `pollution` readings are missing, and separately, some `notes` are missing too (that's expected and not a problem). There's a gap in the `clean_and_average` function, marked with a comment. Fill it in so that `clean_df` contains only the rows where `pollution` is **not missing** — rows missing only a `note` should be kept.

      Expected output:
      ```
      Rows before cleaning: 6
      Rows after cleaning: 4
      Mean pollution: 21.12
      ```
    starter_code: |
      import pandas as pd

      def clean_and_average(df):
          print(f"Rows before cleaning: {len(df)}")

          # Use pandas' dropna() to remove rows where 'pollution' is missing,
          # store the result in clean_df


          print(f"Rows after cleaning: {len(clean_df)}")
          return round(clean_df["pollution"].mean(), 2)

      df = pd.DataFrame({
          "city":      ["Utrecht", "Amsterdam", "Rotterdam", "Groningen", "Eindhoven", "Nijmegen"],
          "pollution": [21.5, None, 18.2, None, 25.0, 19.8],
          "notes":     ["ok", "sensor drifting", None, "calibration due", None, "ok"],
      })

      mean_pollution = clean_and_average(df)
      print(f"Mean pollution: {mean_pollution}")
    tests:
      - type: output_equals
        value: |
          Rows before cleaning: 6
          Rows after cleaning: 4
          Mean pollution: 21.12
      - type: assert
        code: |
          result = clean_and_average(df)
          assert result == 21.12, f"Expected mean pollution 21.12, got {result}"
        description: "clean_and_average(df) should return 21.12 — only rows missing 'pollution' should be dropped"
    hints:
      - "The function you need is pandas' .dropna(), called on df"
      - "Pass subset=[\"pollution\"] so it only checks that column — otherwise rows missing a 'notes' value get dropped too"
      - "The line goes inside the function body — indent it to match the print() lines around it (4 spaces)"
      - "clean_df = df.dropna(subset=[\"pollution\"])"
    solution: |
      import pandas as pd

      def clean_and_average(df):
          print(f"Rows before cleaning: {len(df)}")

          clean_df = df.dropna(subset=["pollution"])

          print(f"Rows after cleaning: {len(clean_df)}")
          return round(clean_df["pollution"].mean(), 2)

      df = pd.DataFrame({
          "city":      ["Utrecht", "Amsterdam", "Rotterdam", "Groningen", "Eindhoven", "Nijmegen"],
          "pollution": [21.5, None, 18.2, None, 25.0, 19.8],
          "notes":     ["ok", "sensor drifting", None, "calibration due", None, "ok"],
      })

      mean_pollution = clean_and_average(df)
      print(f"Mean pollution: {mean_pollution}")

  - id: unfamiliar_function_2
    title: "Using an Unfamiliar Function — Removing Duplicate Readings"
    instructions: |
      Another common data-cleaning problem: **duplicate rows**. A sensor might log the same reading twice, or a spreadsheet might get merged with itself by accident. Here's the function for it, again explained the way you'd find it in documentation:

      **`DataFrame.drop_duplicates(subset=None)`**
      - **Package:** `pandas` (already imported as `pd` below)
      - **What it does:** returns a **new** DataFrame with duplicate rows removed. By default, a row only counts as a duplicate if **every column** matches another row exactly — the first occurrence is kept, later ones are dropped.
      - **Argument `subset`** *(optional)*: a list of column names. If given, rows are considered duplicates based on **just those columns**, ignoring the rest.
      - **Returns:** a new DataFrame (it does not change the original).

      ```python
      unique_df = df.drop_duplicates(subset=["city"])
      ```

      This keeps only the **first** row for each city, even if other columns differ between the repeats.

      **Your task:**
      The script below logs energy readings per city. Some cities were measured more than once: a couple of entries are exact repeats (a logging glitch), but others share a city with a *different* reading (an updated measurement) — those should still count as duplicates for this task, and only the first one kept. There's a gap in `dedupe_and_average`, marked with a comment. Fill it in so `unique_df` keeps only the **first reading per city**.

      Expected output:
      ```
      Rows before deduping: 7
      Rows after deduping: 4
      Mean energy: 165.0
      ```
    starter_code: |
      import pandas as pd

      def dedupe_and_average(df):
          print(f"Rows before deduping: {len(df)}")

          # Use pandas' drop_duplicates() to keep only the first reading per city,
          # store the result in unique_df


          print(f"Rows after deduping: {len(unique_df)}")
          return round(unique_df["energy_kwh"].mean(), 2)

      df = pd.DataFrame({
          "city":       ["Utrecht", "Amsterdam", "Utrecht", "Rotterdam", "Amsterdam", "Groningen", "Utrecht"],
          "energy_kwh": [120, 300, 120, 150, 310, 90, 125],
      })

      mean_energy = dedupe_and_average(df)
      print(f"Mean energy: {mean_energy}")
    tests:
      - type: output_equals
        value: |
          Rows before deduping: 7
          Rows after deduping: 4
          Mean energy: 165.0
      - type: assert
        code: |
          result = dedupe_and_average(df)
          assert result == 165.0, f"Expected mean energy 165.0, got {result}"
        description: "dedupe_and_average(df) should return 165.0 — only the first reading per city should be kept"
    hints:
      - "The function you need is pandas' .drop_duplicates(), called on df"
      - "Pass subset=[\"city\"] so duplicates are identified by city alone — otherwise only rows that match on every column get removed"
      - "The line goes inside the function body — indent it 4 spaces, matching the print() lines around it"
      - "unique_df = df.drop_duplicates(subset=[\"city\"])"
    solution: |
      import pandas as pd

      def dedupe_and_average(df):
          print(f"Rows before deduping: {len(df)}")

          unique_df = df.drop_duplicates(subset=["city"])

          print(f"Rows after deduping: {len(unique_df)}")
          return round(unique_df["energy_kwh"].mean(), 2)

      df = pd.DataFrame({
          "city":       ["Utrecht", "Amsterdam", "Utrecht", "Rotterdam", "Amsterdam", "Groningen", "Utrecht"],
          "energy_kwh": [120, 300, 120, 150, 310, 90, 125],
      })

      mean_energy = dedupe_and_average(df)
      print(f"Mean energy: {mean_energy}")
