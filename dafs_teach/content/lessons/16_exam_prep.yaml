title: "Exam Preparation"
description: "Practice the exam question types: reading code, tracing output, finding errors, writing short scripts from scratch, and slotting an unfamiliar function into existing code."

exercises:

  - id: dice_script
    title: "Reading Code — Dice Roll While Loop"
    instructions: |
      In the exam you will be asked to read a script and explain what each line does, and/or deduce the output.

      Read the following script carefully:

      ```python
      import random

      total_attempts = 0
      target_reached = False

      while not target_reached:
          die1 = random.randint(1, 6)
          die2 = random.randint(1, 6)
          sum_dice = die1 + die2
          total_attempts = total_attempts + 1
          if sum_dice == 7:
              target_reached = True
              print(f"Sum of 7 reached after {total_attempts} attempts.")
          else:
              print(f"Attempt {total_attempts}: Sum = {sum_dice}")
      ```

      Make sure you can answer these questions about it (think before running):
      - What does `while not target_reached` mean at the start?
      - What happens to `total_attempts` on each iteration?
      - When does the loop stop?
      - What is printed when the sum equals 7?

      **Your task:**
      Run the script above (add `random.seed(11)` after the import to make the result repeatable). Then extend it: add a variable `even_sums` that **counts how many times** the dice sum was even before finding 7. Print `even_sums` after the loop.
    starter_code: |
      import random
      random.seed(11)

      total_attempts = 0
      target_reached = False
      even_sums = 0

      while not target_reached:
          die1 = random.randint(1, 6)
          die2 = random.randint(1, 6)
          sum_dice = die1 + die2
          total_attempts = total_attempts + 1
          if sum_dice == 7:
              target_reached = True
              print(f"Sum of 7 reached after {total_attempts} attempts.")
          else:
              print(f"Attempt {total_attempts}: Sum = {sum_dice}")
              # if sum_dice is even, increment even_sums


      print(f"Even sums before finding 7: {even_sums}")
    tests:
      - type: output_contains
        value: "Sum of 7 reached after"
      - type: output_contains
        value: "Even sums before finding 7:"
      - type: assert
        code: |
          assert target_reached == True, "target_reached should be True after the loop"
          assert total_attempts >= 1, "at least one attempt must have been made"
          assert even_sums == 3, "even_sums is not correct yet. Look at the printed attempts: how many of those sums are even?"
        description: "even_sums should count the even sums rolled before the 7"
    hints:
      - "if sum_dice % 2 == 0: even_sums += 1 — inside the else block"
      - "An even sum means the remainder when divided by 2 is 0"
    solution: |
      import random
      random.seed(11)

      total_attempts = 0
      target_reached = False
      even_sums = 0

      while not target_reached:
          die1 = random.randint(1, 6)
          die2 = random.randint(1, 6)
          sum_dice = die1 + die2
          total_attempts = total_attempts + 1
          if sum_dice == 7:
              target_reached = True
              print(f"Sum of 7 reached after {total_attempts} attempts.")
          else:
              print(f"Attempt {total_attempts}: Sum = {sum_dice}")
              if sum_dice % 2 == 0:
                  even_sums += 1

      print(f"Even sums before finding 7: {even_sums}")

  - id: student_grades
    title: "Reading and Extending Code — Student Grades"
    instructions: |
      Another exam question type asks you to **extend** a script. Read the following code carefully, predict what it does, then run it:

      ```python
      students = [
          {"name": "Alice",   "Math": 70, "Science": 80, "English": 60},
          {"name": "Bob",     "Math": 40, "Science": 50, "English": 30},
          {"name": "Charlie", "Math": 65, "Science": 75, "English": 55},
      ]

      for student in students:
          avg_score = (student["Math"] + student["Science"] + student["English"]) / 3
          if avg_score >= 60:
              student["Passed"] = True
          else:
              student["Passed"] = False

      for student in students:
          print(student)
      ```

      Note: `students` is a **list of dictionaries**. Each loop iteration gives you one student's dictionary, and you can add new keys to it with `student["new_key"] = value`.

      **Your task:**
      Extend the first loop to also add a `"grade_letter"` key to each student:

      | Average score | Grade letter |
      |--------------|--------------|
      | ≥ 80 | `"A"` |
      | ≥ 70 | `"B"` |
      | ≥ 60 | `"C"` |
      | < 60 | `"F"` |

      Expected: Alice → B (avg 70), Bob → F (avg 40), Charlie → C (avg 65).
    starter_code: |
      students = [
          {"name": "Alice",   "Math": 70, "Science": 80, "English": 60},
          {"name": "Bob",     "Math": 40, "Science": 50, "English": 30},
