title: Importing and Exporting Data
description: Learn how to load data from CSV, TSV and Excel files using pandas, and how to export your results when you are done.

exercises:

  - id: read_csv_comma
    title: Reading a CSV File
    instructions: |
      Data comes in many different formats. The most basic are `.txt` and `.csv`. **CSV** stands for "Comma Separated Values" — each column is separated by a comma `,`.

      ```python
      import pandas as pd

      df = pd.read_csv("sample_data.csv")
      print(df)
      ```

      In a real project you pass the file path as a string. In this exercise, we simulate a CSV file using Python's `io.StringIO`, which lets you pass text directly to `pd.read_csv()` as if it were a file. The syntax for `pd.read_csv()` is **identical** — only the source changes.

      **Your task:**
      The variable `csv_data` below contains comma-separated data. Use `pd.read_csv(StringIO(csv_data))` to load it into a DataFrame called `df`, then:
      1. Print the shape of `df`
      2. Print the column names
    starter_code: |
      import pandas as pd
      from io import StringIO

      csv_data = """country,pollution,year
      NL,21,2020
      DE,23,2020
      FR,17,2020"""

      # Load into a DataFrame
      df =

      # Print shape and columns
      print(df.shape)
      print(list(df.columns))
    tests:
      - type: output_contains
        value: "(3, 3)"
      - type: output_contains
        value: "country"
      - type: assert
        code: |
          assert df.shape == (3, 3), f"Expected (3, 3), got {df.shape}"
          assert list(df.columns) == ["country", "pollution", "year"]
        description: "df should have shape (3, 3) with columns country, pollution, year"
    hints:
      - "df = pd.read_csv(StringIO(csv_data))"
    solution: |
      import pandas as pd
      from io import StringIO

      csv_data = """country,pollution,year
      NL,21,2020
      DE,23,2020
      FR,17,2020"""

      df = pd.read_csv(StringIO(csv_data))
      print(df.shape)
      print(list(df.columns))

  - id: file_paths
    title: "File Paths: Telling Python Where Your File Is"
    instructions: |
      In `pd.read_csv("sample_data.csv")`, the text between the quotes is a **file path**: the address of the file on your computer. Python needs that address to find the file.

      **What does a file path look like?**

      A path lists the folders you go through to reach the file, from the top of your drive down to the file itself:

      | System | Example path |
      |--------|--------------|
      | Windows | `C:\Users\Sam\Documents\DAFS\emissions.csv` |
      | macOS | `/Users/sam/Documents/DAFS/emissions.csv` |

      Windows separates folders with a **backslash** `\` and starts with a drive letter (`C:`). macOS and Linux use a **forward slash** `/`.

      **Full path or just the file name?**

      - A **full path** (like the examples above) always works, no matter where your script is.
      - If you write **just the file name**, `pd.read_csv("emissions.csv")`, Python looks for the file only in the folder it is currently working in (the *working directory*). If the file is somewhere else, you get:
        ```
        FileNotFoundError: [Errno 2] No such file or directory: 'emissions.csv'
        ```
        You can check which folder Python is working in with:
        ```python
        import os
        print(os.getcwd())
        ```

      When you're starting out, the full path is the easiest choice.

      **How do I find the path of a file?**

      - **Windows:** in File Explorer, right-click the file and choose **Copy as path**. (On Windows 10, hold **Shift** while you right-click.) The path is copied *with* quotes around it, so you can paste it straight between the parentheses.
      - **macOS:** in Finder, select the file and press **Option + Cmd + C**. Or right-click the file, hold the **Option** key, and choose **Copy "emissions.csv" as Pathname**.
      - **VS Code / Jupyter:** right-click the file in the file panel and choose **Copy Path**.

      **The Windows backslash problem**

      Inside Python text, a backslash `\` has a special meaning: it starts a *special character*. You've already seen `\t`, which means "tab". Similarly, `\n` means "new line". So when you paste a Windows path, Python misreads parts of it:

      ```python
      path = "C:\Users\Sam\data\new_emissions.csv"
      ```

      ```
      SyntaxError: (unicode error) 'unicodeescape' codec can't decode bytes in position 2-3: truncated \UXXXXXXXX escape
      ```

      Here `\U` is the problem: Python thinks a special character code starts there. And even when there's no error, `\n` in `\new_emissions.csv` silently becomes a line break, so the path is wrong and pandas can't find the file.

      There are three ways to fix this. All three work:

      | Fix | Example | How it works |
      |-----|---------|--------------|
      | **Forward slashes** | `"C:/Users/Sam/data/new_emissions.csv"` | Windows also understands `/`, and `/` has no special meaning in Python |
      | **Double backslashes** | `"C:\\Users\\Sam\\data\\new_emissions.csv"` | `\\` means "one real backslash" |
      | **Raw string** | `r"C:\Users\Sam\data\new_emissions.csv"` | The `r` before the quotes tells Python to leave all backslashes alone |

      The raw string is the quickest fix after pasting a path from File Explorer: just type an `r` in front of the opening quote. On macOS you don't need any of this, because paths use forward slashes.

      Note that it's **back**slashes that need doubling on Windows. Forward slashes `/` never need to be doubled.

      **Your task:**
      The three lines below each contain the same broken Windows path. Click **Run** to see the error, then fix each line in a different way:
      1. `path_forward`: replace the backslashes with forward slashes
      2. `path_double`: double every backslash
      3. `path_raw`: turn it into a raw string by adding `r` in front of the opening quote
    starter_code: |
      # 1. Fix with forward slashes
      path_forward = "C:\Users\Sam\data\new_emissions.csv"

      # 2. Fix with double backslashes
      path_double = "C:\Users\Sam\data\new_emissions.csv"

      # 3. Fix with a raw string
      path_raw = "C:\Users\Sam\data\new_emissions.csv"

      print(path_forward)
      print(path_double)
      print(path_raw)
    tests:
      - type: output_contains
        value: "new_emissions.csv"
      - type: assert
        code: |
          assert path_forward == "C:/Users/Sam/data/new_emissions.csv", 'path_forward should use forward slashes: "C:/Users/..."'
          assert path_double == "C:\\Users\\Sam\\data\\new_emissions.csv", 'path_double should have every backslash doubled'
          assert path_raw == r"C:\Users\Sam\data\new_emissions.csv", 'path_raw should be the original path with r in front of the quotes'
          import re as _re
          _src = open(__file__, encoding="utf-8").read()
          assert _re.search(r"^path_raw\s*=\s*[rR]['\"]", _src, _re.M), 'path_raw should be a raw string: put r directly in front of the opening quote'
        description: "all three paths should point to C:\\Users\\Sam\\data\\new_emissions.csv, each fixed in its own way"
    hints:
      - "Run the code first and read the error: Python trips over the \\U in C:\\Users"
      - "path_forward = \"C:/Users/Sam/data/new_emissions.csv\""
      - "path_double = \"C:\\\\Users\\\\Sam\\\\data\\\\new_emissions.csv\""
      - "path_raw = r\"C:\\Users\\Sam\\data\\new_emissions.csv\""
    solution: |
      path_forward = "C:/Users/Sam/data/new_emissions.csv"

      path_double = "C:\\Users\\Sam\\data\\new_emissions.csv"

      path_raw = r"C:\Users\Sam\data\new_emissions.csv"

      print(path_forward)
      print(path_double)
      print(path_raw)

  - id: read_csv_separator
    title: Reading Files with a Different Separator
    instructions: |
      CSV files do not always use a comma as the separator. Nowadays data is often separated by a **semicolon** `;`. Because we don't always know what the separator is, we add a `sep` argument to tell pandas how to read the file:

      ```python
      df = pd.read_csv("sample_data.csv", sep=";")
      ```

      If you try to load a semicolon-separated file without specifying `sep=";"`, pandas will treat the entire row as a single column — a very common mistake.

      **Your task:**
      The `csv_data` below is separated by semicolons. Load it into `df` with the correct `sep` argument, then:
      1. Print the shape
      2. Print the value in the `pollution` column for `DE` (the second row, index 1)
    starter_code: |
      import pandas as pd
      from io import StringIO

      csv_data = """country;pollution;year
      NL;21;2020
      DE;23;2020
      FR;17;2020"""

      # Load with the correct separator
      df =

      print(df.shape)
      print(df["pollution"].iloc[1])
    tests:
      - type: output_equals
        value: "(3, 3)\n23"
      - type: assert
        code: |
          assert df.shape == (3, 3), f"Expected (3, 3), got {df.shape} — did you set sep=\";\"?"
          assert df["pollution"].iloc[1] == 23
        description: "df should have 3 rows and 3 columns"
    hints:
      - "pd.read_csv(StringIO(csv_data), sep=\";\")"
    solution: |
      import pandas as pd
      from io import StringIO

      csv_data = """country;pollution;year
      NL;21;2020
      DE;23;2020
      FR;17;2020"""

      df = pd.read_csv(StringIO(csv_data), sep=";")
      print(df.shape)
      print(df["pollution"].iloc[1])

  - id: read_tsv
    title: Reading a TSV File (Tab-Separated)
    instructions: |
      **TSV** is a plain text file where the separator is a **tab** character. In Python, a tab is written as `\t`.

      To read a TSV file, you use the same `pd.read_csv()` function but with `sep="\t"`:

      ```python
      df = pd.read_csv("sample_data.tsv", sep="\t")
      ```

      **Your task:**
      The `tsv_data` below is tab-separated. Load it into `df`, then:
      1. Print the shape
      2. Print the `country` column
    starter_code: |
      import pandas as pd
      from io import StringIO

      tsv_data = "country\tpopulation\tgdp\nNL\t17\t1000\nDE\t84\t4200\nFR\t68\t2800\nBE\t11\t560"

      # Load with the correct separator
      df =

      print(df.shape)
      print(df["country"])
    tests:
      - type: output_contains
        value: "(4, 3)"
      - type: output_contains
        value: "NL"
      - type: output_contains
        value: "BE"
      - type: assert
        code: |
          assert df.shape == (4, 3), f"Expected (4, 3), got {df.shape}"
          assert list(df.columns) == ["country", "population", "gdp"]
        description: "df should have 4 rows and 3 columns"
    hints:
      - "pd.read_csv(StringIO(tsv_data), sep=\"\\t\")"
    solution: |
      import pandas as pd
      from io import StringIO

      tsv_data = "country\tpopulation\tgdp\nNL\t17\t1000\nDE\t84\t4200\nFR\t68\t2800\nBE\t11\t560"

      df = pd.read_csv(StringIO(tsv_data), sep="\t")
      print(df.shape)
      print(df["country"])

  - id: export_csv
    title: Exporting Data to CSV
    instructions: |
      Once you are done with your data operations, you often want to **export** the results to share them, save them, or use them in other software.

      The pandas `.to_csv()` method writes a DataFrame to a CSV file:

      ```python
      df.to_csv('output.csv')
      ```

      By default this also writes the row index (0, 1, 2 …) as the first column. Pass `index=False` to suppress it:

      ```python
      df.to_csv('output.csv', index=False)
      ```

      The file is saved in whatever folder you are working from. You can also export to other formats:

      ```python
      df.to_csv('output.txt', sep='\t')   # TSV
      df.to_excel('output.xlsx')           # Excel (requires openpyxl)
      df.to_json('output.json')            # JSON
      ```

      **Your task:**
      1. Create a DataFrame with 4 columns: `country`, `population`, `gdp`, `gdp_per_capita`
         - Use these values: NL (17M, 1000B), DE (84M, 4200B), FR (68M, 2800B)
         - Compute `gdp_per_capita = gdp / population`
      2. Export it to `output.csv` with `index=False`
      3. Reload it with `pd.read_csv("output.csv")` and print its shape
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          "country": ["NL", "DE", "FR"],
          "population": [17, 84, 68],
          "gdp": [1000, 4200, 2800],
      })

      # Add gdp_per_capita column
      df["gdp_per_capita"] =

      # Export to output.csv without the index
      df.to_csv(         )

      # Reload and print shape
      df_check = pd.read_csv("output.csv")
      print(df_check.shape)
    tests:
      - type: output_equals
        value: "(3, 4)"
      - type: assert
        code: |
          import pandas as pd
          df_check = pd.read_csv("output.csv")
          assert df_check.shape == (3, 4), f"Expected (3, 4), got {df_check.shape}"
          assert "gdp_per_capita" in df_check.columns
          assert abs(df_check.loc[0, "gdp_per_capita"] - 1000/17) < 0.01
        description: "output.csv should have 3 rows and 4 columns including gdp_per_capita"
    hints:
      - "df[\"gdp_per_capita\"] = df[\"gdp\"] / df[\"population\"]"
      - "df.to_csv(\"output.csv\", index=False)"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "country": ["NL", "DE", "FR"],
          "population": [17, 84, 68],
          "gdp": [1000, 4200, 2800],
      })

      df["gdp_per_capita"] = df["gdp"] / df["population"]

      df.to_csv("output.csv", index=False)

      df_check = pd.read_csv("output.csv")
      print(df_check.shape)

