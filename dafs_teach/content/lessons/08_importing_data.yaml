  - id: practice_export_csv
    title: "Practice: Exporting Data to CSV"
    instructions: |
      More practice adding a computed column and exporting the result — this time water usage.

      **Your task:**
      1. Create a DataFrame with 4 columns: `country`, `population`, `water_liters`, `water_per_capita`
         - Use these values: NL (17M, 500B liters), DE (84M, 2000B liters), FR (68M, 1400B liters)
         - Compute `water_per_capita = water_liters / population`
      2. Export it to `output_water.csv` with `index=False`
      3. Reload it with `pd.read_csv("output_water.csv")` and print its shape
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          "country": ["NL", "DE", "FR"],
          "population": [17, 84, 68],
          "water_liters": [500, 2000, 1400],
      })

      # Add water_per_capita column
      df["water_per_capita"] =

      # Export to output_water.csv without the index
      df.to_csv(         )

      # Reload and print shape
      df_check = pd.read_csv("output_water.csv")
      print(df_check.shape)
    tests:
      - type: output_equals
        value: "(3, 4)"
      - type: assert
        code: |
          import pandas as pd
          df_check = pd.read_csv("output_water.csv")
          assert df_check.shape == (3, 4), f"Expected (3, 4), got {df_check.shape}"
          assert "water_per_capita" in df_check.columns
          assert abs(df_check.loc[0, "water_per_capita"] - 500/17) < 0.01
        description: "output_water.csv should have 3 rows and 4 columns including water_per_capita"
    hints:
      - "df[\"water_per_capita\"] = df[\"water_liters\"] / df[\"population\"]"
      - "df.to_csv(\"output_water.csv\", index=False)"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "country": ["NL", "DE", "FR"],
          "population": [17, 84, 68],
          "water_liters": [500, 2000, 1400],
      })

      df["water_per_capita"] = df["water_liters"] / df["population"]

      df.to_csv("output_water.csv", index=False)

      df_check = pd.read_csv("output_water.csv")
      print(df_check.shape)
