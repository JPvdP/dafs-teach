title: Installing Packages and Finding Help
description: Learn the difference between installing and importing a package, what to do when Python can't find one, and how to look up how a function works.

exercises:

  - id: loading_a_package
    title: "Installing vs. Importing a Package"
    instructions: |
      In the first lesson you **imported** packages with `import pandas as pd`. But a package can only be imported if it is **installed** on your computer first. These are two different steps:

      | Step | Where | How often |
      |------|-------|-----------|
      | **Install** — download the package onto your computer | In the **terminal** (not in your Python script) | **Once** per computer |
      | **Import** — load the package into your script | At the top of your **script** | **Every** script that uses it |

      You install a package with `pip`, Python's package installer, in the terminal:

      ```bash
      pip install pandas
      ```

      If you use Anaconda, `conda install pandas` works too. In this app pandas, numpy and matplotlib are already installed, so you won't need to install anything for the exercises. But you will need it the first time you work on your own computer.

      Sometimes the name you install isn't the same as the name you import. For example, you install the machine learning package with `pip install scikit-learn`, but import it with `import sklearn`. The package's documentation always tells you both names.

      **When Python can't find a package**

      If you import a package that Python can't find, you get a `ModuleNotFoundError`:

      ```
      ModuleNotFoundError: No module named 'seaborn'
      ```

      There are two possible causes:
      1. **A typo** in the package name. Check the spelling first: it's the most common cause.
      2. The package is **not installed** yet. Fix it by running `pip install seaborn` in the terminal (not in your script), and then run your script again.

      **Your task:**
      The script below gives a `ModuleNotFoundError`. Click **Run**, read the last line of the error, and fix the import so the script prints the table.
    starter_code: |
      import panda as pd

      df = pd.DataFrame({
          "city": ["Utrecht", "Groningen"],
          "solar_panels": [5200, 3100],
      })

      print(df)
    tests:
      - type: output_contains
        value: "Groningen"
      - type: assert
        code: |
          import sys
          assert 'pandas' in sys.modules, 'pandas was not imported. Check the spelling of the package name'
        description: "pandas must be imported"
    hints:
      - "Read the last line of the error message: which module name couldn't Python find?"
      - "The package is called pandas, with an s at the end"
      - "import pandas as pd"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "city": ["Utrecht", "Groningen"],
          "solar_panels": [5200, 3100],
      })

      print(df)

  - id: finding_help
    title: "Finding Help With Functions"
    instructions: |
      Nobody memorises every function and its arguments — knowing how to **look things up** is a core programming skill. Two easy ways to get help without leaving Python:

      **1. The built-in `help()` function** — prints the official documentation for anything you pass it:

      ```python
      import pandas as pd
      help(pd.Series)
      ```

      **2. Official online documentation** — search "pandas Series documentation", or go straight to the source: [pandas.pydata.org/docs](https://pandas.pydata.org/docs/). Every well-maintained package has official docs like this, and they're usually more reliable than random blog posts or forum answers.

      **Your task:**
      1. Import `pandas` as `pd`
      2. Call `help(pd.Series)` and take a look at what gets printed
    starter_code: |
      import pandas as pd

      # Call help() on pd.Series

    tests:
      - type: output_contains
        value: "Series"
      - type: output_contains
        value: "Help on class"
    hints:
      - "help(pd.Series)"
    solution: |
      import pandas as pd

      help(pd.Series)

  - id: using_the_docs
    title: "Using the Documentation to Learn a New Function"
    instructions: |
      Now let's use `help()` for what it's really for: finding out how to use a function you don't know yet.

      A help page always follows the same structure. The most useful parts are:

      - **The first line**, e.g. `round(self, decimals: 'int' = 0, ...)` — the function's name and its **arguments**. `decimals = 0` means the argument is called `decimals`, and if you don't give it, it is `0`.
      - **The one-line summary** of what the function does.
      - **Parameters** — an explanation of every argument.
      - **Examples** — short pieces of code showing how it's used. Often the quickest way to understand a function.

      Here is part of the help page you get with `help(pd.Series.round)`:

      ```
      round(self, decimals: 'int' = 0, *args, **kwargs) -> 'Series'
          Round each value in a Series to the given number of decimals.

          Parameters
          ----------
          decimals : int, default 0
              Number of decimal places to round to. If decimals is negative,
              it specifies the number of positions to the left of the decimal point.
      ```

      You can give an argument by its position, `.round(2)`, or by its **name**, `.round(decimals=2)`. Using the name makes your code easier to read.

      **Your task:**
      The temperatures below have far too many decimals.
      1. Run `help(pd.Series.round)` yourself and read the help page (you can remove that line afterwards)
      2. Use `.round()` with the `decimals` argument to round the `temp_c` column to **1 decimal**, and store the result back in the `temp_c` column
      3. Print `df`
    starter_code: |
      import pandas as pd

      df = pd.DataFrame({
          "station": ["De Bilt", "Eelde", "Vlissingen", "Maastricht"],
          "temp_c": [11.4637, 9.8251, 12.0549, 11.9912],
      })

      # 1. Read the help page


      # 2. Round temp_c to 1 decimal


      # 3. Print df

    tests:
      - type: output_contains
        value: "Vlissingen"
      - type: assert
        code: |
          assert df["temp_c"].tolist() == [11.5, 9.8, 12.1, 12.0], 'temp_c should be rounded to 1 decimal, and stored back in df["temp_c"]'
        description: "the temp_c column should be rounded to 1 decimal"
    hints:
      - "help(pd.Series.round) shows the help page"
      - "The argument for the number of decimals is called decimals"
      - "df[\"temp_c\"] = df[\"temp_c\"].round(decimals=1)"
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "station": ["De Bilt", "Eelde", "Vlissingen", "Maastricht"],
          "temp_c": [11.4637, 9.8251, 12.0549, 11.9912],
      })

      help(pd.Series.round)

      df["temp_c"] = df["temp_c"].round(decimals=1)

      print(df)
